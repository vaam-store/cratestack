[workspace]
# Deliberately its own workspace root (see the description below), so it
# does not inherit the root repo's `[workspace.lints]` — the two workspaces
# are disjoint. cratestack#523 requires the `unsafe_code = "forbid"`
# guarantee to hold here too, so it's declared locally and opted into via
# `[lints]\nworkspace = true` below, mirroring the root's own table.

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "cratestack-studio-ui"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "Leptos+Trunk web UI for CrateStack Studio. Built independently of the workspace because it targets wasm32-unknown-unknown."
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.7", features = ["http", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
