[package]
name = "cratestack-client-flutter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints.rust]
# `flutter_rust_bridge_codegen`'s generated `src/frb_generated.rs`
# (gitignored, produced by `just frb-generate crates/cratestack-client-flutter`
# — cratestack#563 decision: glue is generated in CI/locally, never
# committed) crosses a raw Dart<->Rust FFI boundary and uses `unsafe` to do
# it, same category as `cratestack-cbor-napi` and
# `examples/embedded-flutter/native`. Unlike those two, the generated
# module is feature-gated (`#[cfg(feature = "frb-glue")] mod
# frb_generated;` in `src/lib.rs`) so it never enters a default build —
# but Cargo lints apply to the whole manifest regardless of feature
# selection, so the crate still needs this override to let a `--features
# frb-glue` build (the one CI's drift check exercises) compile at all.
#
# Deliberately NOT `[lints]\nworkspace = true` (cratestack#523): Cargo
# rejects mixing workspace-inherited lints with a per-package override in
# the same manifest. Registered in `EXEMPT_MANUAL_OVERRIDE` in
# `.ci/lints_workspace_check.py`.
unsafe_code = "allow"
# `flutter_rust_bridge_macros`@2.13.0's `#[frb(...)]` attribute checks an
# internal `cfg(frb_expand)` as part of its two-pass expansion; that cfg is
# never declared via `--check-cfg`, so `#[cfg_attr(feature = "frb-glue",
# flutter_rust_bridge::frb(sync))]` (used on `src/cbor/mod.rs`'s bridged
# functions instead of a bare `#[frb(sync)]`, so the attribute itself
# disappears under this crate's default, non-`frb-glue` features) trips
# `unexpected_cfgs` under `--features frb-glue`. Verified this is
# `flutter_rust_bridge`'s own internal cfg, not anything this crate
# introduces — allowed rather than worked around.
unexpected_cfgs = "allow"

[lib]
# `rlib` (default target for every other consumer of this crate) plus
# `cdylib` — flutter_rust_bridge's generated Dart bindings load this
# crate as a native dynamic library. `cdylib` builds cleanly with zero
# exported symbols even without the `frb-glue` feature (the C-ABI exports
# only exist inside the feature-gated `frb_generated` module), so adding
# it here doesn't change what a default `cargo build`/`cargo test`
# produces from every other member's point of view.
crate-type = ["cdylib", "rlib"]

[features]
# `flutter_rust_bridge_codegen`'s generated glue crosses the Dart<->Rust
# FFI boundary and is deliberately not committed (cratestack#563 decision
# — see the `unsafe_code` override comment above). Gating `mod
# frb_generated;` behind this feature (off by default) means a fresh
# checkout's `cargo build`/`cargo test -p cratestack-client-flutter` never
# needs the generated file to exist — only `--features frb-glue` does
# (what `just frb-generate` + a follow-up `cargo build --features
# frb-glue` exercise). This is what keeps this crate a normal workspace
# member instead of joining `embedded_flutter_native` on the
# `--exclude` lists.
frb-glue = ["dep:flutter_rust_bridge"]
# The Flutter bridge surface exposes `FlutterRuntimeCodec::Json` as a
# selectable transport, so the JSON codec has to be linked in or
# `RuntimeHandle::new` rejects the Json variant at runtime. Keep it
# on by default; a host shell that locks the bridge to CBOR can
# `default-features = false` to drop it.
default = ["codec-json", "decimal-rust-decimal"]
codec-json = ["cratestack-client-rust/codec-json"]
# Forwards `cratestack-client-rust`'s pluggable HTTP transport
# (cratestack#926) so a consumer reaching this facade can hand the
# generated client a `reqwest_middleware::ClientWithMiddleware` —
# retries, tracing spans, caching — without depending on
# `cratestack-client-rust` directly. Off by default and additive: with
# it off, nothing new enters the dependency graph.
middleware = ["cratestack-client-rust/middleware"]
# `cratestack-client-rust`'s dependency edge has `default-features = false`
# at the workspace root, so — same as `codec-json` above — this crate must
# explicitly forward its own decimal-backend choice through, or the plain
# `cratestack-client-rust.workspace = true` edge below picks up neither of
# `cratestack-client-rust`'s own `decimal-rust-decimal`/`decimal-bigdecimal`
# features at all (cratestack#495).
# Also forwards to `cratestack-codec-cbor`/`cratestack-core`: the `cbor`
# module (cratestack#563) uses `CborCodec` directly, and a `Decimal`-typed
# dev-dependency test fixture exercises the same backend, so both real and
# dev-dependency edges need the choice threaded through, or
# `--features decimal-bigdecimal` under `cargo test`/`cargo check
# --all-targets` conflicts with a hardcoded backend here.
decimal-rust-decimal = [
    "cratestack-client-rust/decimal-rust-decimal",
    "cratestack-codec-cbor/decimal-rust-decimal",
    "cratestack-core/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-client-rust/decimal-bigdecimal",
    "cratestack-codec-cbor/decimal-bigdecimal",
    "cratestack-core/decimal-bigdecimal",
]

[dependencies]
cratestack-client-rust.workspace = true
# Real (not dev-only) as of cratestack#563: the `cbor` module wraps
# `CborCodec` directly for the flutter_rust_bridge-facing encode/decode
# entry points — see `src/cbor.rs`.
cratestack-codec-cbor.workspace = true
cratestack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Optional + feature-gated (`frb-glue`, above): pins the same version as
# `examples/embedded-flutter/native`'s own `flutter_rust_bridge` dependency
# so the two frb-bridged crates in this workspace never drift onto
# different codegen-compatible versions. Only pulled into the build graph
# when `frb-glue` is enabled, i.e. never for a default `cargo build`/
# `cargo test -p cratestack-client-flutter`.
flutter_rust_bridge = { version = "=2.13.0", optional = true }

[dev-dependencies]
async-stream = "0.3"
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
url.workspace = true
uuid.workspace = true
