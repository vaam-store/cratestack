[package]
name = "cratestack-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CrateStack server facade — Postgres (sqlx) backend with Axum HTTP bindings, generated Rust client runtime, and the shared schema/parser/policy/SQL surface. Pick this crate via `cratestack = { package = \"cratestack-pg\" }` for backend services."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# The library is named `cratestack` so that integration tests under
# `tests/` resolve `::cratestack::*` paths (which the schema macros
# emit) without per-file aliasing. External consumers depend on the
# package as `cratestack = { package = "cratestack-pg" }` — Cargo's
# package-rename mechanism already exposes the lib under whatever name
# they pick on their side, so this `[lib] name` change is invisible
# downstream.

[lints]
workspace = true

[lib]
name = "cratestack"
path = "src/lib.rs"

[features]
default = ["postgres", "decimal-rust-decimal", "codec-json"]
# Cargo-feature-gates `sqlx`/`cratestack-sqlx` (cratestack#329). Default-on so
# every existing `db = Postgres` consumer sees zero behavior change; a
# consumer that only ever uses `db = None` schemas (cratestack#327/#328) can
# opt out with `default-features = false` (re-adding whichever of
# `decimal-rust-decimal`/`codec-json` they still want) to keep `sqlx` and its
# transitive dependency tree out of their build entirely. `datasource
# { provider = "none" }` schemas can never declare a `model`, so nothing
# generated under `db = None` ever references the sqlx-backed symbols this
# feature gates — see `crates/cratestack-macros/src/include/server.rs` and
# `include/server/runtime/none.rs`. Also forwards `cratestack-macros`'s own
# `postgres` feature (cratestack#347), which
# `datasource_guard::guard_server_postgres_backend` checks before emitting
# any sqlx-flavored codegen — this crate has it on by default (via this very
# line), so nothing changes here; the guard exists to give a clear
# `compile_error!` under facades that don't, like `cratestack-api`.
#
# `cratestack-sqlx` binding a specific decimal backend (cratestack#421,
# revised for cratestack#495): `cratestack-sqlx`'s query-builder support
# code (`query/support/values.rs`) binds `cratestack_core::Decimal` values
# unconditionally, not behind any feature gate, the same way it binds
# `Uuid`/`DateTime`/etc — so `postgres` structurally requires *some*
# decimal backend to be selected on `cratestack-sqlx`, or the crate won't
# compile at all. Before cratestack-bigdecimal existed, that meant this
# feature could safely hardcode `cratestack-sqlx/decimal-rust-decimal`
# unconditionally, since there was only one backend to want. That is no
# longer true: hardcoding a specific backend here would make
# `--features postgres,decimal-bigdecimal` request BOTH backends on
# `cratestack-sqlx` simultaneously — a hard `compile_error!` (the two are
# mutually exclusive) — making `decimal-bigdecimal` unreachable through
# this facade entirely, exactly the outcome cratestack#495 exists to fix.
# So `postgres` now selects *neither* backend by itself; pick one via
# `decimal-rust-decimal` (on by default, see below) or `decimal-bigdecimal`
# explicitly. The practical effect: `--no-default-features --features
# postgres` alone (no decimal feature) is no longer sufficient on its own
# — see `.ci/feature-matrix.sh`'s matrix, which asserts this fails loudly
# rather than silently compiling with an unintended backend.
postgres = [
    "dep:cratestack-sqlx",
    "cratestack-macros/postgres",
]
# `cratestack-sqlx?/...` (weak-dependency syntax, not plain `cratestack-sqlx/...`)
# is required here: a plain `pkg/feature` edge unconditionally activates the
# optional `cratestack-sqlx` dependency as a side effect, which would defeat
# `postgres`'s gating for a `default-features = false` consumer who still
# wants `decimal-rust-decimal` for a `Decimal`-typed procedure arg/return
# under `db = None`. The `?` makes the sub-feature apply only if
# `cratestack-sqlx` is already enabled some other way (i.e. via `postgres`).
# Also forwards to `cratestack-sql`, `cratestack-client-rust`, and
# `cratestack-macros` — this crate's other direct `cratestack-core`-
# consuming dependencies (each with their own `default-features = false`
# treatment — see root `Cargo.toml`) — so all of them stay in lockstep
# with whichever backend is chosen here. Also forwards to
# `cratestack-codec-cbor`, `cratestack-codec-json`, and `cratestack-migrate`
# — dev-dependencies only (see `[dev-dependencies]` below), but Cargo's
# feature resolver still unifies dev-dependency feature requests with the
# rest of the graph for the same workspace member, so a hardcoded backend
# on any of those three dev edges would conflict with an explicit
# `--features decimal-bigdecimal` here under `cargo check --all-targets` /
# `cargo test` (verified: it does, with the mutual-exclusion
# `compile_error!`, even though a plain `cargo check` without `--tests`
# doesn't compile dev-dependencies at all and so doesn't surface it).
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-sql/decimal-rust-decimal",
    "cratestack-client-rust/decimal-rust-decimal",
    "cratestack-macros/decimal-rust-decimal",
    "cratestack-policy/decimal-rust-decimal",
    "cratestack-parser/decimal-rust-decimal",
    "cratestack-axum/decimal-rust-decimal",
    "cratestack-codec-cbor/decimal-rust-decimal",
    "cratestack-codec-json/decimal-rust-decimal",
    "cratestack-migrate/decimal-rust-decimal",
    "cratestack-sqlx?/decimal-rust-decimal",
]
# Mirrors `decimal-rust-decimal` above for the `bigdecimal` backend
# (cratestack#495).
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-sql/decimal-bigdecimal",
    "cratestack-client-rust/decimal-bigdecimal",
    "cratestack-macros/decimal-bigdecimal",
    "cratestack-policy/decimal-bigdecimal",
    "cratestack-parser/decimal-bigdecimal",
    "cratestack-axum/decimal-bigdecimal",
    "cratestack-codec-cbor/decimal-bigdecimal",
    "cratestack-codec-json/decimal-bigdecimal",
    "cratestack-migrate/decimal-bigdecimal",
    "cratestack-sqlx?/decimal-bigdecimal",
]
# Forwards the JSON codec to the generated client runtime. On by default
# so `include_client_schema!` keeps offering both CBOR and JSON; disable
# (`default-features = false`) on backend services that speak only CBOR
# on the wire and want to drop the `JsonCodec` wrapper type from the
# client surface. CBOR stays unconditional — the schema macros emit
# `pub struct Client<C = CborCodec>` — and the projection-view client
# methods (`get_view` / `list_view` / `list_view_paged`) route through
# the client's codec, so they keep working over CBOR when this feature
# is off.
codec-json = ["cratestack-client-rust/codec-json"]
# Forwards `cratestack-client-rust`'s pluggable HTTP transport
# (cratestack#926) so a consumer reaching this facade can hand the
# generated client a `reqwest_middleware::ClientWithMiddleware` —
# retries, tracing spans, caching — without depending on
# `cratestack-client-rust` directly. Off by default and additive: with
# it off, nothing new enters the dependency graph.
middleware = ["cratestack-client-rust/middleware"]
# NOT YET FUNCTIONAL — enabling this feature is a hard compile_error!, not a
# working FIPS mode. It exists only as a reserved name so a future PR can
# wire it up without a breaking rename. `aws-lc-rs` is not a dependency of
# this crate under any feature, and `cratestack-sqlx`/`cratestack-client-rust`
# both hard-select the `ring` rustls backend at compile time regardless of
# this flag — additive Cargo features can't subtract that. Making this a
# real FIPS mode requires the TLS backend becoming a genuine choice across
# both of those crates first (tracked:
# https://github.com/cratestack/cratestack/issues/334). Until then this
# feature must never silently compile and return success — see
# `install_fips_crypto_provider`'s compile_error! below.
crypto-aws-lc-rs = []
# Forwards `cratestack-macros`'s own `rate_limit` feature (cratestack#161's
# Cargo-feature enforcement mechanism, `crates/cratestack-macros/src/include/
# extension_gate.rs`) — this is what turns off the `compile_error!` a schema
# declaring `extension rate_limit { }` otherwise hits. Off by default:
# enabling it only unlocks the
# `@no_rate_limit` procedure attribute and the `rate_limited_by_default`
# field it threads onto the generated `OpDescriptor` (docs/design/
# extensions.md §5) — participation-only, never a numeric limit. Does *not*
# gate `cratestack-axum`'s existing `RateLimitLayer`/`RateLimitConfig`/store
# code, which stays unconditionally compiled and is unaffected by this
# feature — see cratestack#154's scope note.
rate_limit = ["cratestack-macros/rate_limit"]
# End-to-end `pgvector` extension support (see
# `docs/design/extensions.md` §6): unlocks `Vector(n)` model fields
# for `include_server_schema!`/`include_client_schema!` schemas that
# declare `extension pgvector { }`. Forwards to `cratestack-macros`'
# own gate-only `pgvector` feature (#161's compile-time check — a
# schema declaring the extension without this feature enabled is a
# `compile_error!`, not a silent no-op) and to `cratestack-sqlx`'s
# `pgvector` feature (real Postgres `vector` column encode/decode via
# the `pgvector` crate).
pgvector = ["cratestack-macros/pgvector", "cratestack-sqlx/pgvector"]
# End-to-end PostGIS support (see `docs/design/extensions.md` §6b and
# cratestack#842): unlocks `Geography(...)`/`Geometry(...)` model
# fields for schemas that declare `extension postgis { }`. Forwards to
# `cratestack-macros`' gate-only `postgis` feature (the
# `compile_error!` check) and to `cratestack-sqlx`'s `postgis` feature
# (spatial column bind/decode). Adds no new third-party dependency —
# PostGIS's wire format is EWKB, i.e. bytes.
postgis = ["cratestack-macros/postgis", "cratestack-sqlx/postgis"]

[dependencies]
async-stream.workspace = true
chrono.workspace = true
cratestack-axum.workspace = true
cratestack-client-rust.workspace = true
cratestack-core.workspace = true
cratestack-macros.workspace = true
futures-util.workspace = true
cratestack-parser.workspace = true
cratestack-policy.workspace = true
cratestack-sql.workspace = true
cratestack-sqlx = { workspace = true, optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
# Plain edges, not hardcoded `features = [...]`: `cratestack-codec-cbor`,
# `cratestack-codec-json`, and `cratestack-migrate` all get their backend
# from THIS crate's own `decimal-rust-decimal`/`decimal-bigdecimal`
# feature (see the forwards there) — Cargo's feature resolver unifies
# dev-dependency feature requests with the rest of the graph for the same
# workspace member, so hardcoding a backend here independently would
# conflict with `--features decimal-bigdecimal` under `cargo test`/`cargo
# check --all-targets` (verified: it does, tripping the mutual-exclusion
# `compile_error!`).
cratestack-codec-cbor.workspace = true
cratestack-codec-json.workspace = true
cratestack-migrate.workspace = true
minicbor-serde.workspace = true
# Real HTTP/1.1 client for the `@@subscribe` SSE end-to-end test
# (`tests/rpc_subscribe_sse.rs`, cratestack#390) — handles
# `Transfer-Encoding: chunked` framing (axum streams SSE bodies without a
# known `Content-Length`) so the test doesn't have to hand-roll chunked
# decoding on top of a raw `TcpStream`. Already a workspace dependency
# (`examples/rpc-streaming` uses it the same way for `@stream` procedures).
# #440: `rustls-no-provider` needs a crypto provider installed before the
# bare `reqwest::Client::new()` above (`generated_client_rust*.rs`'s
# `CratestackClient`-based tests get it for free via that constructor's own
# fallback; only `rpc_subscribe_sse.rs`'s direct `reqwest::Client` needs this
# explicitly).
reqwest.workspace = true
rustls.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Only compiled/run under `--features pgvector` — the fixture schema
# declares `extension pgvector { }`, which is a `compile_error!`
# without the feature (see the `pgvector` feature doc comment above).
[[test]]
name = "pgvector_feature_forwarding"
path = "tests/pgvector_feature_forwarding.rs"
required-features = ["pgvector"]

# Only compiled/run under `--features postgis` — the fixture schema
# declares `extension postgis { }`, which is a `compile_error!`
# without the feature (see the `postgis` feature doc comment above).
[[test]]
name = "postgis_feature_forwarding"
path = "tests/postgis_feature_forwarding.rs"
required-features = ["postgis"]

# Also `postgis`-gated (cratestack#842): this test drives
# `covers_geography`/`dwithin_geography`, which now live behind
# `cratestack-sql`'s `postgis` feature. It was auto-discovered before
# that surface was gated; declaring it explicitly is what keeps a
# default-feature `cargo test` compiling.
[[test]]
name = "banking_builder_extensions_tier7"
path = "tests/banking_builder_extensions_tier7.rs"
required-features = ["postgis"]

# Live decode round-trip for a real `geography` column (cratestack#842).
# `postgis`-gated like the two above; skips cleanly when the database
# has no PostGIS.
[[test]]
name = "postgis_round_trip"
path = "tests/postgis_round_trip.rs"
required-features = ["postgis"]

# Live nearest-neighbor verification of the cratestack#163 query-builder
# distance operators — needs a real `pgvector/pgvector` Postgres (not
# the default `compose.yml` one), so it's not part of `just test-pg`'s
# normal green path either; see the test file's own module docs for how
# to run it.
[[test]]
name = "pgvector_distance_query"
path = "tests/pgvector_distance_query.rs"
required-features = ["pgvector"]

# Only compiled/run under `--no-default-features --features
# postgres,decimal-bigdecimal` (cratestack#495) — the `--no-default-features`
# is required, not just `--features decimal-bigdecimal` layered on top of
# the default `decimal-rust-decimal`, since the two backends are mutually
# exclusive (see the test file's own module docs). Also needs a live
# Postgres via `CRATESTACK_TEST_DATABASE_URL`/`CRATESTACK_USE_TESTCONTAINERS`,
# same as `banking_decimal.rs`; skips silently without one.
[[test]]
name = "decimal_bigdecimal_backend"
path = "tests/decimal_bigdecimal_backend.rs"
required-features = ["postgres", "decimal-bigdecimal"]
