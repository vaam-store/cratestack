# Narrow, dated allowlist for the file-length check
# (`.ci/file-length-check.sh`, CLAUDE.md "200-LoC file ceiling").
#
# Every entry names exactly ONE file. There is no directory or glob form,
# deliberately: a directory-wide entry would hide any *other* file in that
# directory that grows past the ceiling later, which is exactly how a
# convention rots into a formality.
#
# The checker treats an unmatched entry — a file that has since been split,
# or that no longer exists — as a HARD FAILURE, the same way
# `.ci/layer-direction-allowlist.toml` does. Remove the entry in the same PR
# that splits the file.
#
# Seeded 2026-08-29 from the backlog that existed when the check was added:
# 116 files, largest 553 lines. This is a paydown list, not a permanent
# exemption — the point of enforcing the ceiling now is that the backlog can
# only shrink.
#
# `crates/cratestack-auth` is deliberately ABSENT: it was the worst offender
# (4 files, 549-904 lines of code each) and was split in the same change that
# added this check, from 6 files/max 1381 to 65 files/max 193.
#
# Each entry:
#   path   = repo-relative path
#   lines  = line count when the entry was added (context, not a threshold)
#   issue  = "#NNN" - the tracking issue for the paydown (required)
#   added  = "YYYY-MM-DD"
#   reason = one line of context (required)

