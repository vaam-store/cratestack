name: cratestack_builder
# Kept inside pub.dev's recommended 60-180 char range (pana flags longer
# descriptions as truncated in search results) — see README.md.
description: >-
  build_runner generator producing fluent builders for classes annotated
  with CrateStack's @CratestackBuilder. A dev dependency — the annotation
  itself lives in cratestack_annotations.
version: 0.12.0
homepage: https://cratestack.dev
repository: https://github.com/cratestack/cratestack
issue_tracker: https://github.com/cratestack/cratestack/issues
topics:
  - codegen
  - build-runner
  - builder

environment:
  sdk: ^3.5.0

dependencies:
  # SPANS BOTH MAJORS ON PURPOSE — this is the step that unblocks the
  # analyzer-13 migration, and it is deliberately the ONLY step in it.
  #
  # The constraint used to be `>=12.0.0 <13.0.0`, justified as protecting
  # `riverpod_generator`, whose own constraint was `analyzer ^12.0.0`. That
  # stopped being true: riverpod_generator 4.0.6 moved to `^13.0.0` and
  # 4.0.8 requires it, so the old ceiling had become the *cause* of the
  # incompatibility it was written to prevent.
  #
  # It cannot be fixed by simply flipping to `>=13 <14`, because two CI
  # gates constrain this package from opposite directions:
  #
  #   * `just verify-dart` resolves this builder from the WORKING TREE, so
  #     it needs the generated-client templates to match the in-tree
  #     constraint.
  #   * the `flutter (flutter-riverpod example)` job pins the floors from
  #     `crates/cratestack-client-dart/src/package_floors.rs` and resolves
  #     from pub.dev, so it needs those same templates to match the
  #     PUBLISHED builder.
  #
  # While in-tree and published sat on different majors those were mutually
  # exclusive, and v0.9.0 proved it — the floor gate correctly refused a
  # generated client no user could have resolved.
  #
  # A range spanning both majors dissolves the deadlock without disabling
  # either gate: this release publishes a builder that satisfies analyzer 12
  # AND 13 while the templates stay on their analyzer-12 pins (both gates
  # green), and only THEN can the templates and `CRATESTACK_BUILDER_FLOOR`
  # move to analyzer 13 against a published builder that already accepts it.
  #
  # `sdk:` below deliberately stays `^3.5.0`. analyzer 13.0.0 needs
  # `^3.9.0` and 13.1+ needs `^3.11.0`, so on an older SDK pub simply
  # resolves analyzer 12 from this range — the published compatibility
  # promise does not narrow, which an outright `>=13` bump would have
  # forced. Verified with `dart analyze --fatal-infos` against analyzer
  # 12.1.0 and 13.3.0: the one API this package uses (see
  # `builder_generator.dart`'s `FieldFormalParameterElement` note) compiles
  # clean on both.
  #
  # The floor is deliberately well above the minimum that compiles: at
  # `^8.x` the analyzer reports a language version older than the SDK
  # ("SDK language version 3.13.0 is newer than `analyzer` language version
  # 3.11.0"), i.e. it parses newer syntax with older rules.
  analyzer: '>=12.0.0 <14.0.0'
  build: ^4.0.7
  # issue #668 phase 3 / cratestack#754: `0.8.10` is the first
  # `cratestack_annotations` release with the `touchFlagFields`/
  # `nonDefaultingListFields` arguments this generator reads off
  # `@CratestackBuilder(...)` — an older resolved release has no such
  # constant fields to read, and `ConstantReader.read(...)` on a missing
  # field throws at generation time rather than at `pub get`.
  #
  # CORRECTED by cratestack#754. This read `^0.8.8`, justified as "0.8.7
  # is the first release with those arguments". Both halves were wrong,
  # checked against pub.dev's API and the published archives rather than
  # the changelog: **0.8.8 was never published** (versions run 0.8.7 ->
  # 0.8.10, since 0.8.8/0.8.9 were skipped releases) and **0.8.7 does not
  # contain either identifier**. It was harmless only because a caret
  # resolves upward, so `^0.8.8` landed on 0.8.10+ anyway — a floor that
  # had already rotted before anything could depend on it, which is why
  # the generator's matching floors are now guarded by tests rather than
  # by a comment (`cratestack-client-dart/src/package_floors.rs`).
  #
  # Raise this ONLY when this builder starts reading a newly-added
  # annotation field — never as part of a routine version bump. See
  # `docs/tooling/dart-publishing.md`.
  # Raised `^0.8.10` -> `^0.9.1` on 2026-08-30. This is the one exception to
  # the "never as part of a routine version bump" rule directly above, and it
  # is not a routine bump: `^0.8.10` means `>=0.8.10 <0.9.0`, so once
  # `cratestack_annotations` published at 0.9.1 this constraint FORBADE the
  # only release a generated client can now ask for. Leaving it produces
  #
  #   Because cratestack_builder >=0.8.14 depends on cratestack_annotations
  #   ^0.8.10 and <client> depends on cratestack_annotations ^0.9.1,
  #   cratestack_builder >=0.8.14 is forbidden.
  #
  # See cratestack#838 and `cratestack-client-dart/src/package_floors.rs`.
  # WIDENED to a range, not raised. `^0.9.1` (>=0.9.1 <0.10.0) has an EMPTY
  # intersection with the `^0.8.10` floor every already-generated client
  # declares, so a raise breaks them all; `^0.8.10` in turn FORBIDS the
  # 0.9.x annotations release a client now wants. Only a range satisfies
  # both, which is what lets this publish BEFORE the client floors move —
  # they cannot move in the same release, because the flutter example job
  # pins the PUBLISHED builder and neither 0.9.1 nor 0.9.2 accepts 0.9.x.
  # Same shape as the analyzer 12/13 range above, one layer down.
  cratestack_annotations: '>=0.8.10 <0.10.0'
  source_gen: ^4.0.0

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.0.0
  lints: ^6.0.0
  test: ^1.25.0


