name: CI

on:
  pull_request:
    branches: ["main"]
    # Docs-only changes never need the ~40-job suite. `docs/adr/**` is
    # re-included because `.ci/layer-direction-check.sh` reads
    # `docs/adr/layers.toml` — a change there must still run the
    # `layer-direction` job. Expressing the exclusion as a `paths` allow-list
    # with `!` negation (not `paths-ignore`) is the documented pattern for
    # "run on everything except X".
    paths:
      - "**"
      - "!docs/**"
      - "docs/adr/**"
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!docs/**"
      - "docs/adr/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Change detection (job-level path gating) -----------------------
  # Computes which component directories changed so the heterogeneous
  # language/component jobs below can be gated with dorny/paths-filter
  # instead of running on every PR. The workflow-level `paths-ignore` above
  # is the first, cheapest filter; this is the job-level complement.
  #
  # Every filter deliberately over-includes (generator crates, example
  # schemas, shared infra: justfile/.ci/.github) so a change that can affect
  # a job's output re-runs that job — a false RUN is cheap, a false SKIP is
  # silently lost coverage. `base: ${{ github.ref }}` is ignored on
  # pull_request events (the action uses the PR base via the REST API) and
  # on push-to-main compares against the commit before the push, per the
  # action's documented long-lived-branch semantics. `workflow_dispatch`
  # bypasses all gating via the `github.event_name` OR in each gated job's
  # `if:`.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cbor: ${{ steps.filter.outputs.cbor }}
      dart: ${{ steps.filter.outputs.dart }}
      dart_pkgs: ${{ steps.filter.outputs.dart_pkgs }}
      ts: ${{ steps.filter.outputs.ts }}
      changelog: ${{ steps.filter.outputs.changelog }}
      npm: ${{ steps.filter.outputs.npm }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            cbor:
              - 'dart-packages/cratestack_cbor/**'
              - 'crates/cratestack-cbor-napi/**'
              - 'crates/cratestack-cbor-wasm/**'
              - 'crates/cratestack-client-flutter/**'
              - 'crates/cratestack-client-dart/**'
              - 'crates/cratestack-codec-cbor/**'
              - 'examples/**'
              - 'justfile'
              - '.ci/**'
              - '.github/**'
            dart:
              - 'dart-packages/**'
              - 'crates/cratestack-client-dart/**'
              - 'crates/cratestack-client-flutter/**'
              - 'crates/cratestack-cbor-wasm/**'
              - 'crates/cratestack-cbor-napi/**'
              - 'crates/cratestack-codec-cbor/**'
              - 'examples/**'
              - 'justfile'
              - '.ci/**'
              - '.github/**'
            dart_pkgs:
              - 'dart-packages/cratestack_annotations/**'
              - 'dart-packages/cratestack_builder/**'
              - 'justfile'
              - '.ci/**'
              - '.github/**'
            ts:
              - 'packages/**'
              - 'crates/cratestack-client-typescript/**'
              - 'crates/cratestack-client-dart/**'
              - 'crates/cratestack-client-flutter/**'
              - 'crates/cratestack-client/**'
              - 'crates/cratestack-cli/**'
              - 'crates/cratestack-parser/**'
              - 'crates/cratestack-macros/**'
              - 'crates/cratestack-sql/**'
              - 'examples/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - 'biome.json'
              - 'justfile'
              - '.ci/**'
              - '.github/**'
            changelog:
              - '**/CHANGELOG.md'
              - '.ci/changelog*'
              - 'justfile'
              - '.github/**'
            npm:
              - 'packages/cratestack-cli-npm/**'
              - '.ci/npm-publish*'
              - 'justfile'
              - '.github/**'
            cli:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.ci/**'
              - '.github/**'

  # ---- Blocking gates --------------------------------------------------
  check:
    # Bounded so a hang fails in minutes instead of squatting on a runner for
    # GitHub's 6h default — three jobs did exactly that on 2026-08-24 (cratestack#704
    # investigation), and ci.yml had no timeout anywhere.
    timeout-minutes: 45
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert Cargo.lock is up to date
        # Must run BEFORE rust-cache: that action invokes `cargo metadata`
        # without `--locked`, which would silently regenerate a stale
        # lockfile on the runner and mask the drift the `--locked` gate
        # below is meant to catch. This is the un-maskable assertion.
        run: cargo metadata --locked --format-version=1 > /dev/null
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: cargo check (workspace, all targets)
        # `--locked` also fails if the build itself would change the lock.
        run: just check --locked
      - name: cargo check (embedded facade for wasm32-unknown-unknown)
        # Prove the embedded backend compiles to the documented wasm32 target
        # (issue #419). The workspace check above is host-target only; this
        # step verifies the wasm32 surface in isolation (without Postgres
        # features that would drag in sqlx/rust_decimal).
        run: cargo check --locked -p cratestack-sqlite --target wasm32-unknown-unknown
      - name: Assert rustc, rust-toolchain.toml, and Cargo.toml rust-version agree
        # Verify the MSRV declaration (#422) stays synchronized with the
        # pinned toolchain and what rustc actually resolved to. Three-way
        # equality guards against the rust-version/rust-toolchain.toml
        # drift path the two-way check alone would leave uncovered.
        run: |
          resolved=$(rustc --version | awk '{print $2}')
          pinned=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          declared=$(awk -F'"' '/^rust-version/{print $2; exit}' Cargo.toml)
          echo "resolved rustc: $resolved | rust-toolchain.toml: $pinned | Cargo.toml rust-version: $declared"
          [ "$resolved" = "$pinned" ] || { echo "::error::CI resolved rustc $resolved, expected rust-toolchain.toml's $pinned"; exit 1; }
          [ "$pinned" = "$declared" ] || { echo "::error::rust-toolchain.toml ($pinned) and Cargo.toml rust-version ($declared) have drifted apart"; exit 1; }

  msrv:
    timeout-minutes: 45
    name: msrv (1.98.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check --locked

  facade-disjointness:
    timeout-minutes: 45
    name: facade disjointness (examples/no-database-verification*, examples/client-only-verification, examples/db-transaction-verification, examples/declarative-query-verification)
    runs-on: ubuntu-latest
    # `examples/no-database-verification`, `-api`, and `client-only-
    # verification` are each their own `[workspace]` root (see their
    # READMEs) specifically so a real `cargo tree` proves what an external
    # consumer's dependency graph would actually contain — a workspace
    # member can't prove this, because Cargo unifies features across every
    # member building a shared dependency in one session (cratestack#329,
    # cratestack#347, cratestack#490). This job re-runs those proofs on
    # every PR so a stale/broken lockfile or a regressed disjointness
    # guarantee fails CI instead of silently drifting (cratestack#422).
    #
    # `examples/db-transaction-verification` (cratestack#513) is the same
    # pattern applied to a *direct*-dependency claim rather than a
    # transitive-absence one: `sqlx` is expected (and present) transitively
    # via `cratestack-sqlx`, so its proof is "no `sqlx = ...` line in this
    # Cargo.toml", not "cargo tree has no sqlx at all" — plus a real
    # Postgres run (testcontainers; GitHub-hosted runners ship Docker) to
    # prove `db.transaction(...)` actually works from that Cargo.toml, not
    # just that it compiles.
    #
    # `examples/declarative-query-verification` (cratestack#867) is the
    # identical shape for epic #488's remaining gap, with one extra grep:
    # as well as "no `sqlx = ...` line", `src/` must contain no `sqlx::`
    # path *and* no SQL string — the SQL belongs in `schema.cstack`, where
    # its `$N` references are compile-time checked and an `@allow` is
    # attached. A real Postgres run proves the query executes and that the
    # policy actually refuses a principal it should.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/no-database-verification
            examples/no-database-verification-api
            examples/client-only-verification
            examples/db-transaction-verification
            examples/declarative-query-verification
      - name: Assert Cargo.lock is up to date (no-database-verification)
        working-directory: examples/no-database-verification
        run: cargo metadata --locked --format-version=1 > /dev/null
      - name: Assert Cargo.lock is up to date (no-database-verification-api)
        working-directory: examples/no-database-verification-api
        run: cargo metadata --locked --format-version=1 > /dev/null
      - name: Assert Cargo.lock is up to date (client-only-verification)
        working-directory: examples/client-only-verification
        run: cargo metadata --locked --format-version=1 > /dev/null
      - name: Assert Cargo.lock is up to date (db-transaction-verification)
        working-directory: examples/db-transaction-verification
        run: cargo metadata --locked --format-version=1 > /dev/null
      - name: Assert Cargo.lock is up to date (declarative-query-verification)
        working-directory: examples/declarative-query-verification
        run: cargo metadata --locked --format-version=1 > /dev/null
      - name: sqlx absent by default (no-database-verification, postgres feature off)
        working-directory: examples/no-database-verification
        run: |
          if cargo tree --locked | grep -qi sqlx; then
            echo "::error::expected no sqlx/cratestack-sqlx in the default (postgres feature off) dependency graph"
            cargo tree --locked | grep -i sqlx
            exit 1
          fi
      - name: sqlx present behind the postgres feature (no-database-verification)
        working-directory: examples/no-database-verification
        run: |
          if ! cargo tree --locked --features postgres | grep -qi sqlx; then
            echo "::error::expected cratestack-sqlx in the dependency graph with --features postgres"
            exit 1
          fi
      - name: sqlx absent unconditionally (no-database-verification-api)
        working-directory: examples/no-database-verification-api
        run: |
          if cargo tree --locked | grep -qi sqlx; then
            echo "::error::expected no sqlx/cratestack-sqlx in the cratestack-api dependency graph"
            cargo tree --locked | grep -i sqlx
            exit 1
          fi
      - name: axum absent unconditionally (client-only-verification)
        # `cratestack-client` re-exports only `include_client_schema!` plus
        # the generated Rust client runtime (see
        # `crates/cratestack-client/src/lib.rs`'s module doc) and has no
        # feature that could ever pull `axum` in transitively (the gRPC
        # surface that once could, via `tonic`, was removed in v0.9 — see
        # ADR 0017), so its default feature set is its only state to prove
        # absence for, same as `no-database-verification-api` above. `tower`/`hyper`/
        # `tower-http` are deliberately NOT asserted absent here — they
        # arrive via `reqwest` (the HTTP client transport
        # `cratestack-client-rust` builds on), not via `cratestack-axum`,
        # and asserting them absent would assert something false and
        # unrelated to what this crate exists to prove. See this example's
        # README "Why tower/hyper/tower-http aren't asserted absent".
        working-directory: examples/client-only-verification
        run: |
          if cargo tree --locked | grep -qi axum; then
            echo "::error::expected no axum/cratestack-axum in the cratestack-client dependency graph"
            cargo tree --locked | grep -i axum
            exit 1
          fi
      - name: no direct sqlx dependency (db-transaction-verification)
        working-directory: examples/db-transaction-verification
        run: |
          if grep -Eq '^\s*sqlx\s*=' Cargo.toml; then
            echo "::error::expected no direct sqlx dependency in db-transaction-verification's Cargo.toml"
            exit 1
          fi
      - name: no direct sqlx dependency (declarative-query-verification)
        working-directory: examples/declarative-query-verification
        run: |
          if grep -Eq '^\s*sqlx\s*=' Cargo.toml; then
            echo "::error::expected no direct sqlx dependency in declarative-query-verification's Cargo.toml"
            exit 1
          fi
      - name: no sqlx path and no SQL in src (declarative-query-verification)
        # The extra claim this example carries over its #513 sibling: the
        # SQL belongs in `schema.cstack`, not in Rust. `src/` is checked,
        # not `tests/` — the test file legitimately uses
        # `cratestack::sqlx::query` for its own fixture DDL, the same way
        # `crates/cratestack-pg/tests/banking_*.rs` do.
        working-directory: examples/declarative-query-verification
        run: |
          if grep -rnE '\bsqlx::|\bSELECT\b' src/ | grep -vE '^\S+:[0-9]+:\s*(//|///|//!)'; then
            echo "::error::expected no sqlx:: path and no SQL string in declarative-query-verification's src/"
            exit 1
          fi
      - name: cargo test (no-database-verification, both feature states)
        working-directory: examples/no-database-verification
        run: |
          cargo test --locked
          cargo test --locked --features postgres
      - name: cargo test (no-database-verification-api)
        working-directory: examples/no-database-verification-api
        run: cargo test --locked
      - name: cargo test (client-only-verification)
        working-directory: examples/client-only-verification
        run: cargo test --locked
      # `--test-threads=1` on both: each test in these crates starts its
      # own testcontainer, and concurrent starts hit a port-bind race that
      # fails as `RootlessKit PortManager.AddPort(): address already in
      # use` — indistinguishable from a real failure in the log. Observed
      # twice locally on rootless Docker. Serializing costs a few seconds
      # and removes the flake; see CONTRIBUTING.md's rootless-Docker note.
      - name: cargo test against real Postgres (db-transaction-verification)
        working-directory: examples/db-transaction-verification
        env:
          # Force the testcontainer/DB connection failure mode to a hard
          # error rather than a silent per-test skip — same rationale as
          # the `tests-db` job's own `CRATESTACK_REQUIRE_DB`.
          CRATESTACK_REQUIRE_DB: "1"
        run: cargo test --locked -- --test-threads=1
      - name: cargo test against real Postgres (declarative-query-verification)
        working-directory: examples/declarative-query-verification
        env:
          # Same reason as the step above: without this, a runner whose
          # Docker can't start the container would skip every test and
          # still print `ok`.
          CRATESTACK_REQUIRE_DB: "1"
        run: cargo test --locked -- --test-threads=1

  # ---- Test shards -----------------------------------------------------
  # The suite is split into four parallel jobs so no single runner has to
  # compile the whole workspace — pulling the tauri/wasm/napi example crates
  # into one `cargo test --workspace` exhausts the runner's disk. Each shard
  # needs only its own slice of the toolchain (Docker / Trunk / neither), and
  # none needs the GTK/WebKit deps since the tauri examples are excluded.
  # Recipes: `test-ci-{db,redis,studio,host}` in the justfile.
  tests-db:
    timeout-minutes: 45
    name: tests (db — Postgres)
    runs-on: ubuntu-latest
    env:
      # Turn a failed testcontainer/DB connection into a hard error instead
      # of a silent per-test skip — a broken Docker runner would otherwise
      # pass this gate green while skipping all PG coverage.
      CRATESTACK_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: cargo test (testcontainers Postgres)
        run: just test-ci-db --locked
      - name: cargo test (decimal-bigdecimal backend, testcontainers Postgres)
        # cratestack#421 AC3: proves a consumer can select the non-default
        # decimal backend end to end and actually USE it, not just compile
        # against it (`.ci/feature-matrix.sh`, in the feature-matrix job,
        # already covers the compile-only bar). This test file is gated
        # `required-features = ["postgres", "decimal-bigdecimal"]`, so the
        # default-feature step above never builds or runs it.
        run: just test-ci-db-decimal-bigdecimal --locked
      - name: cargo test (cratestack-outbox, testcontainers Postgres)
        # A 2026-08 CI-coverage audit found `cratestack-outbox`'s 5
        # transactional-outbox tests (atomic persist/rollback, cursor-
        # ordered drain, GC sweep) had never been run by any workflow —
        # `grep -rn outbox .github/workflows/*.yml` matched nothing before
        # this step, despite the crate correctly implementing the standard
        # `connect_or_skip`/`CRATESTACK_REQUIRE_DB` shim.
        run: just test-ci-db-outbox --locked
      - name: cargo test (cratestack-migrate postgres-introspect, testcontainers Postgres)
        # A 2026-08 CI-coverage audit found these 7 live-introspection
        # tests (issue #204) were gated `#![cfg(feature =
        # "postgres-introspect")]`, and the only recipe that ever passed
        # that feature was `just test-pg`, which no workflow invoked at
        # all (`grep -rn test-pg .github/workflows/*.yml` matched
        # nothing before this step).
        run: just test-ci-db-migrate-introspect --locked
      - name: cargo test (cratestack-cli migrate baseline, testcontainers Postgres)
        # A 2026-08 CI-coverage audit found these 5 `migrate baseline`
        # tests (issue #205) only ever checked
        # `CRATESTACK_TEST_DATABASE_URL`, with no testcontainers fallback
        # and no `CRATESTACK_REQUIRE_DB` hard-fail — unlike every other
        # PG test in this repo — so 4 of the 5 (the DB-touching ones)
        # silently skipped on every CI run.
        run: just test-ci-db-cli-baseline --locked

  tests-redis:
    timeout-minutes: 45
    name: tests (redis)
    runs-on: ubuntu-latest
    env:
      # Same rationale as `tests-db`'s CRATESTACK_REQUIRE_DB: turn a failed
      # testcontainer/connection into a hard error instead of a silent
      # per-test skip, so a broken Docker runner can't pass this gate green
      # while skipping all 115 idempotency/rate-limit tests (issue #418).
      CRATESTACK_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: cargo test (testcontainers Redis)
        # `--locked` also asserts the committed Cargo.lock.
        run: just test-ci-redis --locked

  tests-studio:
    timeout-minutes: 45
    name: tests (studio + Trunk UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # wasm32 (for the Trunk build below) is installed by rustup from
      # rust-toolchain.toml's `targets` for the pinned channel.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pins wasm-bindgen-cli to the studio-ui lockfile's exact version so
      # Trunk resolves it from PATH instead of downloading it mid-build.
      # See the action's header for the incident and the verification.
      - uses: ./.github/actions/install-trunk-toolchain
      # The `embed-ui` feature (default) embeds the Trunk-built Studio UI via
      # rust-embed, and cratestack-studio's api_smoke tests assert the real
      # index.html is served. The dist isn't checked in, so build it here;
      # cratestack-studio's build.rs picks up the sibling `dist/`. `--locked`
      # asserts the studio-ui's own (separate, tracked) Cargo.lock — the
      # root-workspace `--locked` flags don't cover this excluded sub-workspace.
      - name: Build Studio UI (Trunk)
        run: trunk build --locked
        working-directory: crates/cratestack-studio-ui
      - name: cargo test (studio)
        run: just test-ci-studio --locked
      - name: cargo test (studio — Postgres-backed, testcontainers)
        # `crates/cratestack-studio/tests/postgres_*.rs` skip silently
        # unless CRATESTACK_TEST_DATABASE_URL or CRATESTACK_USE_TESTCONTAINERS
        # is set — neither of which this job used to set, so this decisive
        # coverage reported `ok` on every CI run without ever touching a
        # real database (a coverage audit found this is how the duplicate-
        # column bug PR #553 fixed shipped: its own regression test never
        # actually ran here). CRATESTACK_REQUIRE_DB turns a failed
        # testcontainer/DB connection into a hard error instead of a
        # silent skip, same rationale as the `tests-db` job's own
        # CRATESTACK_REQUIRE_DB. A separate step in this job (not a
        # separate job) so the Trunk UI build above — needed by
        # `test-ci-studio`'s api_smoke tests, not by these — isn't paid
        # for a second time.
        env:
          CRATESTACK_REQUIRE_DB: "1"
        run: just test-ci-studio-db --locked

  tests-host:
    timeout-minutes: 45
    name: tests (host — everything else)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # This shard contains cratestack-client-typescript's
      # `swr_hooks_invalidation` and `decimal_round_trip` tests, which shell
      # out to `npm`/`npx` and run a real vitest suite against unpinned `^`
      # devDependency ranges. It had NO setup-node step, so it silently
      # inherited whatever Node the runner image happened to ship — the exact
      # implicit dependency that produced the reproduced `TypeError:
      # webidl.util.markAsUncloneable is not a function` failure documented at
      # length in prepare-release.yml (see the comment above its own
      # setup-node step). Pin it explicitly so the version is a decision
      # rather than a property of the runner image: 24 both matches every
      # other Node pin in this repo and clears jsdom@30's `>=22.22.2` floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: cargo test (host — no DB, no wasm/desktop toolchain)
        # All remaining crates + light example smoke tests. DB-gated tests
        # skip cleanly here (no REQUIRE_DB). cratestack-redis is excluded
        # from this shard entirely — it has its own blocking `tests-redis`
        # job above (issue #418). `--locked` asserts the committed
        # Cargo.lock.
        run: just test-ci-host --locked

  # ---- Ignored-test report (non-blocking) -------------------------------
  # Report-only, never blocks the PR gate: closes the structural hole a
  # 2026-08 audit of the policy layer found — an `#[ignore]`d test could
  # (and did) sit un-run forever, since nothing anywhere ran `-- --ignored`
  # (confirmed at the time: no workflow, no justfile recipe, anywhere in
  # this repo passed `--include-ignored`/`-- --ignored`). Two of the four
  # `#[ignore]`s that audit found were REAL, confirmed authorization bugs
  # silently sitting unreported for an unknown length of time — this job
  # exists so that can't happen invisibly again. `continue-on-error: true`
  # is the actual non-blocking mechanism (a red run here shows as a
  # yellow/neutral check, never fails the required-checks gate); the
  # recipe itself also always `exit 0`s, as a second, redundant belt, so
  # a local `just test-ci-ignored-report` run behaves the same way.
  # `CRATESTACK_REQUIRE_DB` is set for the same reason `tests-db` sets it —
  # without it, a broken testcontainers/Docker runner would silently skip
  # every DB-backed `#[ignore]` and this job would report a false "all
  # clean" instead of surfacing the real, tracked bugs.
  #
  # This does NOT replace reading `#[ignore]` reason strings during
  # review — it's a safety net for the case where nobody does that for a
  # while, not a substitute for it.
  tests-ignored-report:
    timeout-minutes: 45
    name: tests (ignored — report only, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CRATESTACK_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: cargo test -- --ignored (report only)
        run: just test-ci-ignored-report --locked

  # ---- Embedded-isolation gate -----------------------------------------
  # Blocking. Builds the embedded (rusqlite) surface and its examples WITHOUT
  # any Postgres crate in the build graph. The `check` job above builds
  # `--workspace`, where Cargo unifies features across every member — and
  # `sqlx-postgres` pulls `rust_decimal` with its `std` feature, which the
  # embedded facade intentionally does not. That unification can make
  # embedded-only code compile on the workspace runner while failing for a
  # real embedded consumer (and via the example's own documented
  # `cargo run -p cratestack-sqlite --example …` command). Building these
  # packages in isolation reproduces the embedded consumer's feature set,
  # so the masking can't happen. (Regression guard: sqlite_offline_first,
  # which compiled under `--workspace` but not standalone.)
  embedded-examples:
    timeout-minutes: 45
    name: embedded examples (isolated build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null
      - uses: Swatinem/rust-cache@v2
      - name: Build embedded facade + its examples in isolation
        # A single `-p cratestack-sqlite` (no other members) keeps Postgres
        # crates out of the graph, so rust_decimal resolves without `std` —
        # the exact config the examples must compile under.
        run: cargo build --locked -p cratestack-sqlite --examples
      - name: Build embedded facade for wasm32-unknown-unknown
        # Prove one of the documented wasm32 browser examples actually
        # compiles to that target (issue #419). This is a cargo build,
        # not a full wasm-pack/Trunk build (which would need extra tools),
        # but it proves the example's Rust surface is wasm32-compatible.
        run: cargo build --locked -p embedded-browser-vite-example --target wasm32-unknown-unknown
      - name: Build standalone embedded example crates in isolation
        run: |
          cargo build --locked \
            -p embedded-cli-example \
            -p embedded-daemon-example \
            -p embedded-webhook-example

  # ---- Feature-graph regression matrix (cratestack#421, cratestack#495) -
  # Blocking. Runs a representative matrix across every crate either issue
  # touched: (1) `decimal-rust-decimal`/`decimal-bigdecimal` are asserted
  # mutually exclusive (#495 made the second backend real — it used to be
  # a dead `compile_error!`, #421's fix was "must not be selectable at
  # all"), (2) every facade with its own decimal toggle compiles clean
  # under its default feature set and BOTH backends individually, with
  # `cratestack-core`'s `default = ["decimal-rust-decimal"]` asserted to
  # never leak through and `rust_decimal` asserted unreachable once
  # `decimal-bigdecimal` is selected — verified via `cargo tree
  # -e features`, since that's a property of the *resolved dependency
  # graph*, not something a plain `#[test]` inside a crate can observe —
  # and (3) every "plain" crate whose `cratestack-core` edge became
  # explicit still compiles, including the wasm32-only edges. See
  # `.ci/feature-matrix.sh`.
  feature-matrix:
    timeout-minutes: 45
    name: feature matrix (cratestack#421, cratestack#495)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Feature-graph regression matrix
        run: just feature-matrix

  # Layer-direction check (ADR 0014). Manifest-only (`cargo metadata
  # --no-deps`) — no toolchain component beyond stable Rust + Python 3
  # (already on the runner image) is needed, so no `rust-cache`/`just`
  # install step is required either; kept minimal on purpose.
  layer-direction:
    timeout-minutes: 45
    name: layer direction (ADR 0014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Layer-direction check
        run: ./.ci/layer-direction-check.sh

  # Workspace-lints opt-in check (cratestack#523). Manifest-only (`cargo
  # metadata --no-deps`) — same reasoning as `layer-direction` above, no
  # `rust-cache`/`just` install step needed.
  lints-workspace-optin:
    timeout-minutes: 45
    name: workspace lints opt-in (cratestack#523)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Workspace-lints opt-in check
        run: ./.ci/lints-workspace-check.sh

  # File-length ceiling check. `CLAUDE.md` declares a ~200-line-per-file
  # convention; until this job existed nothing enforced it, and it had
  # drifted to 116 files over the limit (largest 553 lines) — the same
  # silent way `[workspace.lints]` drifted before cratestack#523.
  # `.ci/file-length-allowlist.toml` grandfathers that backlog so the
  # ceiling binds for NEW code immediately, and a stale entry (a file since
  # split or deleted) is a hard failure, so the list can only shrink.
  # Pure file I/O — no toolchain beyond `actions/checkout` and python3,
  # which ubuntu-latest already ships.
  file-length:
    timeout-minutes: 45
    name: file-length ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File-length ceiling check
        run: ./.ci/file-length-check.sh

  # ```ignore-fence convention check (cratestack#683). Grep-only — no
  # toolchain component beyond `actions/checkout` is needed.
  ignore-doctest-fence:
    timeout-minutes: 45
    name: doctest fences (cratestack#683)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: '```ignore-fence convention check'
        run: ./.ci/ignore-doctest-fence-check.sh

  # Release-rehearsal guard check (cratestack#652). The rehearsal's own
  # acceptance criterion is structural — "the rehearsal cannot publish
  # under any input combination, verified by inspection of every publish
  # step's guard, not by trusting a flag" — so the inspection is a script
  # and this job is what runs it.
  #
  # It matters more than a normal lint because `release-cli.yml` CANNOT be
  # exercised on a PR: its first execution against any change is a
  # production release. This job is the only thing standing between an
  # unguarded publish step and a burned version number.
  release-rehearsal-guard:
    timeout-minutes: 10
    name: release rehearsal cannot publish (cratestack#652)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Every irreversible publish step is guarded
        run: python3 .ci/release-rehearsal-guard-check.py

  # napi target drift check (cratestack#850). `@cratestack/cbor-node`'s
  # platform list is duplicated between `napi.targets` in its package.json
  # and the `build-cbor-node` matrix in release-cli.yml, and the two must
  # agree exactly, in both directions.
  #
  # Same "cannot be exercised on a PR" reasoning as the rehearsal guard
  # above: a mismatch produces no signal at all until a tag is pushed, and
  # then it either aborts `publish-npm-cbor-node` outright (target with no
  # leg) or silently drops a platform from npm while CI stays green (leg
  # with no target) — the second being precisely the failure #850 reports.
  #
  # Invokes the `just` recipe rather than the script directly, for the same
  # reason the flutter/js drift steps call `just regen-examples --check`:
  # the recipe developers run locally and the thing CI runs are then one
  # command, and cannot copy-paste diverge.
  napi-targets:
    timeout-minutes: 10
    name: napi.targets matches the build matrix (cratestack#850)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # The script's one non-stdlib dependency; it checks for the module
      # itself and fails as a setup error rather than as a drift report.
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: napi.targets and build-cbor-node agree
        run: just verify-napi-targets

  # Changelog verification (issue #479). Detects unedited changelog seeds
  # that would silently degrade the changelog from prose to a commit list
  # (worse than an honest gap, because it looks maintained but isn't), AND
  # (cratestack#739) that no entry a PR adds landed under a dated release
  # section instead of "## Unreleased". Blocking gate for any PR that
  # touches a declared changelog.
  changelog-verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.changelog == 'true' }}
    timeout-minutes: 45
    name: changelog (no unedited seeds, correct placement)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, not the default 1 (mirrors quality.yml,
      # prepare-release.yml, cut-release-tag.yml): the placement check
      # diffs against `origin/main` to find the lines a PR itself adds
      # (cratestack#739) — a shallow, single-commit checkout never has
      # `origin/main` as a resolvable ref at all, which would make the
      # check silently no-op on every PR rather than actually run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Changelog verification
        run: just verify-changelog

  # Tests for changelog-seed.sh/changelog-check.sh themselves (issue #479).
  # Runs against an isolated sandbox copy of CHANGELOG.md, never the real,
  # tracked file — see .ci/changelog-seed-tests.sh.
  changelog-seed-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.changelog == 'true' }}
    timeout-minutes: 45
    name: changelog (seed/check script tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Changelog seed/check tests
        run: just changelog-seed-test

  # Tests for the npm publish wrapper's failure classification (the
  # v0.11.1 misclassification, run 33808493207). Fake npm, no network.
  npm-publish-wrapper-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.npm == 'true' }}
    timeout-minutes: 10
    name: npm publish wrapper (classification tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: npm-publish.sh classification tests
        run: just npm-publish-test

  # ---- Lint gates ------------------------------------------------------
  # Blocking. Determinism comes from rust-toolchain.toml pinning the
  # version (and clippy/rustfmt components), so new stable lints/format
  # changes can't spontaneously turn these red between Rust releases —
  # bump the pin deliberately. `just lint` allows a small, documented set
  # of codegen-friendly lints (see the justfile).
  clippy:
    timeout-minutes: 45
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: cargo clippy -D warnings
        run: just lint

  rustfmt:
    timeout-minutes: 45
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: cargo fmt --check
        run: just fmt-check

  # ---- Dart generator verification --------------------------------------
  # Blocking. Closes a pre-existing hole (issue #300, first story of epic
  # #297): before this job, nothing in CI ever ran the emitted Dart through
  # a Dart/Flutter toolchain — `grep -rn "dart\|flutter" .github/workflows/`
  # matched only rustdoc-pages.yml, and the Rust-side snapshot tests under
  # crates/cratestack-client-dart/tests/ only assert on generated *text*,
  # which can't catch a missing import, an undefined symbol, or a type
  # error in the emitted Dart. That gap is real: see `templates.rs`'s
  # `REST_TEMPLATE_SPECS` comment for a historical case where an RPC
  # package reusing a REST-only template failed `flutter analyze` with 3
  # undefined-symbol errors, caught only by a one-off manual run.
  #
  # Follows the sibling-job pattern established by `js (@cratestack/cbor-
  # node)` / `js (@cratestack/cbor-web)`: a dedicated job with its own
  # toolchain setup, not folded into an existing Rust job.
  #
  # `just verify-dart` generates a REST and an RPC package DURING the job
  # from committed fixtures (crates/cratestack-client-dart/tests/fixtures/
  # ci_{rest,rpc}.cstack — multiple models, an enum, a relation, and a
  # procedure each, richer than the tiny_* snapshot fixtures) via the real
  # `cratestack generate-dart` CLI, then runs `flutter analyze` on each —
  # see the justfile recipe's own comment for why Flutter (not the plain
  # Dart SDK) is required and for the analyzer-severity decision
  # (`--fatal-warnings`, `--no-fatal-infos`).
  #
  # Issue #301 extended the recipe to also cover `--preset riverpod`: the
  # same ci_rest/ci_rpc fixtures plus a dedicated
  # riverpod_shared_ownership.cstack fixture for the per-model fan-out
  # layout's ownership rule (a genuinely shared enum, a procedure-only
  # nested type, and a relation cycle across mutually-importing model
  # files) — still one job, the preset matrix lives inside `just
  # verify-dart` itself.
  #
  # cratestack#647 gap closure: `--native-cbor` (opt-in dependency on the
  # published `cratestack_cbor` package instead of pure-Dart `package:cbor`)
  # shipped with its real-compiler proof run ONCE BY HAND, never re-run —
  # `native_cbor_generator.rs`'s own tests are source-text assertions only.
  # `just verify-dart` now also generates REST and RPC packages with the
  # flag from `native_cbor_echo{,_rpc}.cstack`, resolves `cratestack_cbor`
  # from pub.dev for real, runs `flutter analyze`, and — via
  # `native_cbor_echo_{rest,rpc}_test.dart` — a real request/response round
  # trip through the actual native codec (flutter_rust_bridge, Linux x86_64
  # — this runner's host, one of the three platforms `cratestack_cbor`
  # supports), including the async 4xx CBOR error-decode path on RPC. The
  # riverpod preset is covered analyze-only (see the justfile recipe's own
  # comment for why a second functional round trip there is redundant).
  # Folded into this existing job rather than a new one: it already has the
  # Flutter SDK and pub.dev network access this needs, and this workflow
  # has no `paths:` filtering anywhere (see `cbor-example-verify`'s own
  # comment on that below) — introducing it is an open maintainer question,
  # not decided here, and this addition doesn't change that either way.
  dart-verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dart == 'true' }}
    timeout-minutes: 45
    name: dart (generated packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate + flutter analyze/test (default + riverpod presets, REST + RPC, incl. --native-cbor)
        run: just verify-dart

  # ---- dart-packages/{cratestack_annotations,cratestack_builder} --------
  # Blocking. Covers the two hand-written Dart packages behind the generated
  # clients' builder surface (cratestack#668 phase 1). Uses the Dart SDK
  # directly, not Flutter: neither package depends on `sdk: flutter`, and
  # `cratestack_annotations` has no dependencies at all — pulling in the
  # Flutter SDK here would only slow the job and hide that fact.
  #
  # `--fatal-infos`, stricter than the `--fatal-warnings` the generated-client
  # jobs use: these are published packages, and pub.dev's own scoring treats
  # analyzer infos as defects.
  dart-packages-verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dart_pkgs == 'true' }}
    timeout-minutes: 45
    name: dart (cratestack_annotations + cratestack_builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: dart analyze --fatal-infos + dart test
        run: just verify-dart-packages

  # ---- flutter_rust_bridge glue verification (cratestack#563) -----------
  # Blocking. Closes a gap the ticket itself found: before this job,
  # `grep -rn "frb-generate|flutter_rust_bridge_codegen|frb_generated"
  # .github/` matched nothing anywhere in this repo — so nothing in CI
  # ever proved `flutter_rust_bridge_codegen generate` still succeeds
  # against either frb-bridged crate, for `crates/cratestack-client-flutter`
  # (this job) or for the pre-existing `examples/embedded-flutter/native`
  # (still uncovered — see this PR's description).
  #
  # `just frb-verify-client-flutter` does four things, in order: (1)
  # regenerates the glue via the real `flutter_rust_bridge_codegen`
  # (pinned =2.13.0, matching `crates/cratestack-client-flutter/Cargo.toml`),
  # (2) compiles the crate against it (`--features frb-glue` — the
  # generated `mod frb_generated;` is feature-gated, off by default, so
  # this is the one path that actually exercises it), (3) `dart pub get` +
  # `dart run` on the committed `dart/verify_round_trip.dart` harness,
  # which calls the generated `encodeJson`/`decodeJson` against the
  # compiled cdylib and asserts a real round trip plus byte-identical
  # output against the same cross-binding fixture
  # `cratestack-cbor-napi`/`src/cbor/mod.rs`'s own test suites assert. A
  # Rust-side rename or signature change that would silently break the
  # Dart-facing API surface fails this job, not just step (1) succeeding —
  # this is what makes it a genuine drift check rather than "codegen
  # exited 0".
  #
  # Nothing generated here is committed (cratestack#563 decision), so
  # unlike `dart-verify`'s `--check` discipline there is no textual diff
  # to assert zero on; the compile + real Dart execution IS the check.
  frb-verify-client-flutter:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack-client-flutter frb bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dart-lang/setup-dart@v1
      - name: Install flutter_rust_bridge_codegen (pinned =2.13.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      - name: Regenerate glue, compile, and round-trip from Dart
        run: just frb-verify-client-flutter

  # ---- dart-packages/cratestack_cbor package (cratestack#563) ------------
  # Blocking. Proves BOTH backends of the `cratestack_cbor` Dart package
  # actually work against freshly-regenerated vendored artifacts, not just
  # that codegen/wasm-pack exit 0 — same "regenerate, compile, execute for
  # real" discipline as `frb-verify-client-flutter` above, extended to a
  # second frb-bridged artifact plus a genuinely new surface: dart:js_interop
  # driving a vendored wasm-bindgen bundle in a REAL headless Chrome (`dart
  # test -p chrome`), not merely compiled.
  #
  # `cbor-vendor-native` regenerates the flutter_rust_bridge Dart glue and a
  # release build of the native library (Linux x86_64 only — a deliberate
  # one-platform spike, see the package's README); `cbor-vendor-web` runs
  # `wasm-pack build --target web` against the EXISTING
  # crates/cratestack-cbor-wasm crate (no new codec binding — the same Rust
  # crate already bound to npm as @cratestack/cbor-web). `cbor-verify-package`
  # then runs `dart test` (native, `@TestOn('vm')`) and `dart test -p chrome`
  # (web, `@TestOn('browser')`) against the real published-package public API,
  # both asserting the same shared hex fixtures the napi/wasm/frb Rust test
  # suites already assert — proving byte-identical CBOR across backends, not
  # just internal self-consistency.
  cratestack-cbor-package:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack_cbor package — native + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # wasm32-unknown-unknown is installed by rustup from
      # rust-toolchain.toml's `targets` for the pinned channel (same
      # mechanism the `js-cbor-wasm` job relies on).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      # The Flutter SDK, NOT `dart-lang/setup-dart` — cratestack_cbor stopped
      # being resolvable by a standalone Dart SDK the moment it became a
      # Flutter plugin. Declaring `flutter.plugin.platforms` in its pubspec
      # obliges `environment.flutter` (pub's own publish validator rejects
      # the former without the latter), and that constraint is unsatisfiable
      # without Flutter:
      #
      #   Because cratestack_cbor requires the Flutter SDK, version solving failed.
      #
      # This is easy to miss locally: the Flutter SDK bundles its own `dart`,
      # so on a developer machine `dart pub get` resolves the constraint from
      # the ambient Flutter install and everything looks fine. Only a
      # genuinely standalone Dart SDK — which is exactly what setup-dart
      # installs — reproduces it. Matches the `cratestack-cbor-example` job
      # below, which already uses flutter-action for the same reason.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install flutter_rust_bridge_codegen (pinned =2.13.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      # Same reason as js-cbor-wasm's identical step: wasm-pack downloads
      # its own binaryen (hardcoded version) mid-build unless a `wasm-opt`
      # is already on PATH, and that unpinned fetch has failed a real
      # release run before.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      - name: Vendor native artifacts (flutter_rust_bridge glue + release library)
        run: just cbor-vendor-native
      - name: Vendor web artifact (wasm-pack --target web)
        run: just cbor-vendor-web
      - name: Verify both backends (dart test + dart test -p chrome)
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: just cbor-verify-package

  # ---- cratestack_cbor Flutter app integration (cratestack#563) ----------
  # Blocking, but the single most expensive job in this workflow — see the
  # "CI cost" note below before copying this pattern elsewhere.
  #
  # `cratestack-cbor-package` above proves both backends work under `dart
  # test` — but that was never the actual question this ticket's remaining
  # slice needed answered: `dart test` loads the vendored `.so` directly
  # via `Isolate.resolvePackageUri` + `DynamicLibrary.open`, and the web
  # loader resolves its `.js`/`.wasm` through a dev-server-only URL
  # convention. Neither proves a REAL Flutter app can find these artifacts
  # at runtime after a release build — that needs actual Flutter plugin
  # platform scaffolding (`dart-packages/cratestack_cbor/linux/
  # CMakeLists.txt`) and real Flutter asset bundling (`pubspec.yaml`'s
  # `flutter: assets:`), and the only way to prove either works is to
  # really build and really run the result. `just cbor-example-verify`
  # does exactly that against `dart-packages/cratestack_cbor/example/`:
  # `flutter build linux` + running the built binary headless (`xvfb-run`),
  # and `flutter build web` (release, NOT `flutter run -d chrome`'s dev
  # server) + serving `build/web/` with a plain static file server and
  # driving it with a real headless Chrome via the DevTools Protocol. Both
  # assert the same shared-fixture CBOR hex `cratestack-cbor-package`
  # already asserts under `dart test`.
  #
  # CI cost: this is the heaviest job in the workflow — a full Linux
  # desktop CMake/ninja compile AND a full dart2js web compile, on top of
  # everything `cratestack-cbor-package` already does (frb codegen + a
  # release Rust build + a wasm-pack build). It runs on every PR today,
  # consistent with this workflow's existing convention of no path
  # filtering anywhere (`grep -n paths: .github/workflows/ci.yml` — zero
  # hits) rather than inventing one unilaterally here. If CI spend becomes
  # a concern, scoping this job to changes under `dart-packages/
  # cratestack_cbor/**`, `crates/cratestack-client-flutter/**`, and
  # `crates/cratestack-cbor-wasm/**` via `paths:` (or `dorny/paths-filter`)
  # would be the natural next step — flagged here for a maintainer
  # decision rather than added unilaterally, since it would be the first
  # path-filtered job in this workflow.
  cratestack-cbor-example:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack_cbor example — linux + web, real builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install flutter_rust_bridge_codegen (pinned =2.13.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      # Same reason as cratestack-cbor-package's identical step: wasm-pack
      # downloads its own binaryen (hardcoded version) mid-build unless a
      # `wasm-opt` is already on PATH.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      # `subosito/flutter-action` gives us the Flutter SDK, but a
      # `flutter build linux` also needs the Linux desktop toolchain
      # itself (CMake, Ninja, a C++ compiler, GTK3 dev headers — see this
      # repo's CLAUDE.md's Linux prerequisite note) plus `xvfb` for
      # `just cbor-example-verify`'s headless run of the built binary.
      # None of this is in the default ubuntu-latest image.
      - name: Install Linux desktop + xvfb toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - name: Vendor native artifacts (flutter_rust_bridge glue + release library)
        run: just cbor-vendor-native
      - name: Vendor web artifact (wasm-pack --target web)
        run: just cbor-vendor-web
      - name: flutter build linux + flutter build web, real run + real browser
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: just cbor-example-verify

  # ---- cratestack_cbor Android platform (cratestack#563 platform-matrix
  # slice) ------------------------------------------------------------------
  # Blocking, but deliberately scoped to a real `flutter build apk` PLUS a
  # jniLibs-contents assertion, NOT an emulator run. See "CI cost" below.
  #
  # `cratestack-cbor-example` above proves Linux+web work under a real
  # `flutter build`; this job is the Android analogue for the platform this
  # ticket actually adds — `cargo ndk` cross-compiles
  # crates/cratestack-client-flutter's cdylib for arm64-v8a (every real
  # device), x86_64 (the emulator), and armeabi-v7a (cheap to include, see
  # `just cbor-vendor-android`'s own comment), `android/build.gradle`
  # packages them into the APK via the standard `jniLibs.srcDirs`
  # mechanism (no CMake/NDK invocation at consumer build time — same
  # "vendor, don't build" constraint as Linux), and `just
  # cbor-example-verify-android` asserts `libcratestack_client_flutter.so`
  # actually landed under `lib/<abi>/` inside the built APK for every ABI —
  # a build that merely COMPILES proves nothing about whether the Android
  # plugin scaffolding actually bundled the library (the exact failure mode
  # this ticket exists to catch, mirroring `cbor-example-verify`'s Linux
  # bundle-path assertion).
  #
  # CI cost / what's deliberately NOT here: an NDK cross-compile (3 ABIs)
  # plus a full Gradle `assembleRelease` is real cost on top of everything
  # `cratestack-cbor-package` already pays, but it is bounded — no emulator
  # boots here. Booting and driving an Android emulator (KVM/nested
  # virtualization availability on hosted runners, boot time, occasional
  # hangs) is substantially heavier again and flaky in ways a cross-compile
  # + Gradle build is not, so THAT stays a local/manual gate:
  # `just cbor-example-verify-android-emulator` (see that recipe's own
  # comment in the justfile). Recorded as a deliberate recommendation, not
  # a silent omission — an APK that installs but crashes on
  # `DynamicLibrary.open` is exactly the failure mode this ticket names as
  # what "it built fine" hides, and this job cannot catch that; only the
  # local emulator recipe can. If CI-hosted emulator runs (e.g.
  # `reactivecircus/android-emulator-runner`) become worth the cost, that is
  # a maintainer call, not something to add unilaterally here.
  #
  # Path filtering: this job — like `cratestack-cbor-package` and
  # `cratestack-cbor-example` before it — runs unscoped on every PR,
  # consistent with this workflow's existing convention of no path
  # filtering anywhere. It only adds to the same open "should
  # dart-packages/cratestack_cbor/**-touching jobs be path-filtered"
  # question those two jobs already flagged; not decided here.
  cratestack-cbor-android:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack_cbor android — APK build + jniLibs proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # wasm-pack is needed even though this job never builds for the web —
      # see the "Vendor web artifact" step below for why.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install flutter_rust_bridge_codegen (pinned =2.13.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      # Same reason as the cbor-package and js-cbor-wasm jobs: wasm-pack
      # downloads its own binaryen (hardcoded version) mid-build unless a
      # `wasm-opt` is already on PATH, and that unpinned fetch has failed a
      # real release run before.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      # Pinned exact — matches the version this repo's own vendoring was
      # verified against (see docs/tooling/cratestack-cbor-development.md).
      - name: Install cargo-ndk (pinned =4.1.2)
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: Install Android rustup targets
        run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi
      # GitHub's ubuntu-latest runner image ships an Android SDK
      # (`$ANDROID_HOME`) with several NDK versions already installed, but
      # not reliably the exact one this repo pins (28.2.13676358 — matches
      # Flutter's own default `ndkVersion`, see android/build.gradle's
      # comment and docs/tooling/cratestack-cbor-development.md). Installing
      # it explicitly makes the build deterministic regardless of what the
      # runner image happens to preinstall.
      # Use an NDK the runner already ships rather than downloading one. The
      # previous version of this step ran:
      #
      #   yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install … >/dev/null
      #
      # and failed on the runner with its output discarded, so the reason was
      # invisible. Two independent defects in one line:
      #
      #  1. `yes | cmd` under `set -o pipefail` is a SIGPIPE trap. sdkmanager
      #     stops reading once its prompts are answered, `yes` is killed with
      #     SIGPIPE (exit 141), and pipefail propagates that — the step fails
      #     even when the install succeeded. Verified directly:
      #     `bash -c 'set -euo pipefail; yes | true'` exits 141. This is the
      #     same trap as the `| head -n1` bug fixed in cratestack#578.
      #  2. `>/dev/null` discarded the diagnostic that would have said whether
      #     `cmdline-tools/latest` even exists at that path on this image.
      #
      # GitHub's ubuntu images ship several NDKs and set ANDROID_NDK_LATEST_HOME,
      # so the download was unnecessary work as well as a failure source. Prefer
      # the pinned version when present, fall back to the newest preinstalled,
      # and fail loudly with a directory listing if there is genuinely none —
      # never silently.
      - name: Resolve Android NDK
        run: |
          set -euo pipefail
          pinned="${ANDROID_HOME}/ndk/28.2.13676358"
          if [ -d "$pinned" ]; then
            ndk="$pinned"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            ndk="${ANDROID_NDK_LATEST_HOME}"
          else
            ndk="$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${ndk:-}" ] || [ ! -d "$ndk" ]; then
            echo "::error::no Android NDK found. ANDROID_HOME=${ANDROID_HOME:-unset}, ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}" >&2
            ls -la "${ANDROID_HOME:-/nonexistent}" || true
            ls -la "${ANDROID_HOME:-/nonexistent}/ndk" || true
            exit 1
          fi
          echo "Using Android NDK: ${ndk}"
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
      # frb glue is platform-independent (codegen introspects Rust source,
      # not a target triple) — cbor-vendor-native produces it as a side
      # effect of building the Linux host library, and cbor-vendor-android
      # reuses it rather than regenerating it a second time.
      - name: Vendor native artifacts (flutter_rust_bridge glue + Linux release library)
        run: just cbor-vendor-native
      - name: Vendor Android artifacts (cargo ndk cross-compile, 3 ABIs)
        run: just cbor-vendor-android
      # An ANDROID job has to build the WEB artifact. That reads as a mistake
      # and is not: `pubspec.yaml` declares the wasm pair under `flutter:
      # assets:`, which is how the web backend loads it at runtime, and
      # Flutter has no per-platform asset conditionals. So the asset list
      # applies to every build of any app depending on this package, and a
      # missing file fails the Android build outright:
      #
      #   Target aot_android_asset_bundle failed: Exception: Failed to bundle
      #   asset files.
      #
      # This did not reproduce locally because a developer who has run the
      # full bootstrap already has the wasm on disk. Only a job that vendors
      # a strict subset hits it.
      #
      # KNOWN CONSEQUENCE, not yet addressed: the same declaration means the
      # built APK ships ~145 KB of wasm it can never execute (verified:
      # `assets/flutter_assets/packages/cratestack_cbor/.../cratestack_cbor_wasm_bg.wasm`
      # is inside app-release.apk). Every Android/iOS/desktop consumer carries
      # that dead weight. Fixing it properly is a package-structure decision
      # (e.g. splitting the web backend into its own package) and is left to
      # the maintainer rather than decided here — see cratestack#563.
      - name: Vendor web artifact (required by the pubspec asset list, see above)
        run: just cbor-vendor-web
      - name: flutter build apk + assert vendored library present per ABI
        run: just cbor-example-verify-android

  # ---- shared flutter_rust_bridge glue (cratestack#563) --------------------
  # Generates the frb glue ONCE, on Linux, and hands it to the per-platform
  # jobs as an artifact. Two independent reasons, either of which alone
  # justifies this:
  #
  # 1. `flutter_rust_bridge_codegen` 2.13.0 CANNOT RUN ON WINDOWS in this
  #    repo's layout. Observed on PR #685:
  #
  #      When compute_mod_from_rust_path(
  #        code_path="D:\a\...\cratestack-client-flutter\src/frb_generated.rs",
  #        base_dir="\\?\D:\a\...\cratestack-client-flutter\src")
  #          prefix not found
  #
  #    It builds `code_path` with mixed separators and compares it against a
  #    canonicalized UNC (`\\?\`) base dir; the prefix strip fails. That is
  #    inside the pinned upstream tool, not something this repo can pass
  #    around, so the Windows runner cannot produce its own glue at all.
  #
  # 2. Even where codegen DOES work (Linux, macOS), running it per-platform
  #    means `cargo install --locked flutter_rust_bridge_codegen` — a
  #    multi-minute from-source build — on every leg, to produce output that
  #    is platform-independent by construction (frb introspects Rust source,
  #    not a target triple).
  #
  # Generating once also sidesteps the cross-platform determinism question
  # entirely rather than asserting it: there is exactly one set of generated
  # bytes, so nothing can diverge between runners. Note the tempting
  # assertion here — `git diff --exit-code` over the glue — is a check that
  # CANNOT FAIL, because neither half of the glue is tracked by git (see the
  # justfile's `cbor-vendor-glue` block comment).
  #
  # Deliberately NOT wired into `cratestack-cbor-example`/`-android`/
  # `-package`: those jobs are proven and run codegen inline today, and
  # rewiring them is blast radius this slice does not need. They can adopt
  # this artifact later if the CI-minute saving is judged worth it.
  cbor-glue:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack_cbor frb glue — generated once, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # REQUIRED, and not obvious: frb codegen is a Rust binary, but it
      # shells out to `dart` (`dart --version` as a toolchain probe, and the
      # Dart half of its output). Without this the job dies with
      # "Error: Dart/Flutter toolchain not available … dart: not found".
      # Every other cbor job happens to have Flutter for its own reasons;
      # this one needs it solely for codegen.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install flutter_rust_bridge_codegen (pinned =2.13.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      - name: Vendor flutter_rust_bridge glue (both halves)
        run: just cbor-vendor-glue
      # Both halves ship: the Rust side is what makes
      # `cargo build --features frb-glue` compile at all (without it,
      # `crates/cratestack-client-flutter/src/lib.rs`'s `mod frb_generated;`
      # fails E0583), and the Dart side is what the package's own analyzer /
      # `flutter build` step needs. Neither is committed — both are
      # gitignored build output — so a fresh checkout on the consuming jobs
      # has neither until this artifact lands.
      #
      # Two paths whose least-common-ancestor is the workspace root, so the
      # artifact preserves `crates/…` and `dart-packages/…` and the consumers
      # can restore it with `path: .`.
      - uses: actions/upload-artifact@v7
        with:
          name: cbor-frb-glue
          path: |
            crates/cratestack-client-flutter/src/frb_generated.rs
            dart-packages/cratestack_cbor/lib/src/native/rust
          if-no-files-found: error
          retention-days: 1

  # ---- cratestack_cbor Windows platform (cratestack#563 platform-matrix
  # slice) ------------------------------------------------------------------
  # Proves the Windows leg the same way `cratestack-cbor-android`/`-macos` do,
  # and to the same bar: a real `flutter build windows`, an assertion that the
  # vendored DLL is actually inside the built output, and then RUNNING the
  # built `.exe` and matching the shared `CRATESTACK_CBOR_EXAMPLE_RESULT: OK
  # <hex>` fixture. A build that merely compiles proves nothing — that is the
  # failure mode this ticket exists to catch.
  #
  # NO frb codegen on this runner. `flutter_rust_bridge_codegen` 2.13.0 cannot
  # run on Windows in this repo's layout at all (mixed separators compared
  # against a canonicalized UNC base dir — see the `cbor-glue` job header for
  # the verbatim error), so the glue arrives prebuilt from `cbor-glue` as an
  # artifact and this job asserts it restored before building. Do not "fix"
  # this by adding a `just cbor-vendor-glue` step here; it cannot work.
  #
  # NOT `just cbor-vendor-native` either: that recipe hardcodes a
  # `x86_64-unknown-linux-gnu` build as half of what it does, which cannot
  # link on a Windows host. This job calls `cbor-vendor-lib windows-x64`
  # directly — the same per-platform half `cbor-vendor-native` composes with
  # the Linux one.
  #
  # Also vendors the web artifact for the same reason `cratestack-cbor-
  # android`/`-macos` do (see those jobs' comments): `pubspec.yaml`'s
  # `flutter: assets:` declaration is unconditional and Flutter has no
  # per-platform asset conditionals, so a missing wasm pair fails a Windows
  # build too.
  #
  # VERIFIED by real green runs — these all started as flagged guesses from a
  # Linux-only dev machine and are now settled. Do NOT re-flag them as
  # unknowns:
  #   - `bash` resolves on `windows-latest` (Git for Windows' bundled MSYS),
  #     which this justfile's global `set shell := ["bash", ...]` needs for
  #     EVERY recipe body, not just this job's.
  #   - `cbor-vendor-lib windows-x64`'s `cargo metadata` parse works without
  #     `python3` (grep/sed, incl. the JSON `\\` -> `\` un-escaping for real
  #     Windows paths — see that recipe's comment).
  #   - `timeout` is available for `cbor-example-verify-windows`'s bounded run
  #     of the built GUI app.
  # Steps whose own `run:` block contains bash syntax set `shell: bash`
  # explicitly, mirroring this repo's existing Windows jobs.

  cratestack-cbor-windows:
    needs: [cbor-glue, changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack_cbor windows — real build, DLL + round-trip proof)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # wasm32-unknown-unknown is installed by rustup from
      # rust-toolchain.toml's `targets` for the pinned channel — same
      # mechanism every other cbor job relies on, cross-platform.
      # x86_64-pc-windows-msvc needs no extra `targets:` entry: it is
      # already the default host triple on this runner.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      # The Flutter SDK — same reason as every other cbor job (see
      # cratestack-cbor-package's comment): cratestack_cbor's
      # `flutter.plugin.platforms` pubspec key requires the real Flutter
      # SDK to resolve at all, not a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # NO `cargo install flutter_rust_bridge_codegen` here, and no
      # `just cbor-vendor-glue` below: frb codegen 2.13.0 cannot run on
      # Windows in this layout (mixed separators vs a canonicalized UNC base
      # dir — see the `cbor-glue` job header for the exact error). The glue
      # arrives prebuilt from that job instead.
      - name: Restore frb glue (generated once on Linux by `cbor-glue`)
        uses: actions/download-artifact@v8
        with:
          name: cbor-frb-glue
          path: .
      # Prove the artifact actually landed where the build expects it. Without
      # this, a silently-empty download surfaces later as a bare E0583 from
      # `mod frb_generated;`, which reads as a source bug rather than a
      # missing-artifact problem — that misdiagnosis already cost one CI round
      # trip on this ticket.
      - name: Assert the glue is present
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/cratestack-client-flutter/src/frb_generated.rs \
            || { echo "::error::frb_generated.rs missing after download-artifact — the cbor-frb-glue artifact did not restore. cargo build --features frb-glue would fail with E0583." >&2; exit 1; }
          test -d dart-packages/cratestack_cbor/lib/src/native/rust \
            || { echo "::error::Dart glue directory missing after download-artifact." >&2; exit 1; }
          echo "✓ frb glue restored"
      # Same reason as every other cbor job's identical step: wasm-pack
      # downloads its own binaryen (hardcoded version) mid-build unless a
      # `wasm-opt` is already on PATH. Windows asset name and archive
      # layout differ from Linux's (`.../bin/wasm-opt.exe`, not
      # `.../bin/wasm-opt`) — verified the asset exists and inspected its
      # contents directly (`tar -tzf`) rather than assuming the naming
      # convention carries over; adding its `bin/` directory to
      # `$GITHUB_PATH` is expected to let cross-platform tooling that
      # searches PATH for `wasm-opt` find `wasm-opt.exe` the normal Windows
      # way (PATHEXT-aware resolution), but that specific resolution step
      # is unverified from this Linux dev machine.
      - name: Install binaryen (wasm-opt), pinned
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-windows.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      # NOT `just cbor-vendor-native` — see the job header comment for why
      # (it hardcodes a Linux-target build that cannot link here). The glue
      # half was restored from the `cbor-glue` artifact above.
      - name: Vendor Windows native artifact (release build + copy)
        run: just cbor-vendor-lib windows-x64
      - name: Vendor web artifact (required by the pubspec asset list — see job header comment)
        run: just cbor-vendor-web
      - name: flutter build windows + assert vendored DLL present + round-trip
        run: just cbor-example-verify-windows

  # ---- cratestack_cbor macOS platform (cratestack#563 platform-matrix slice) ----
  # Mirrors `cratestack-cbor-windows` in every structural respect (same job
  # shape, same "real build + assert the artifact is actually bundled +
  # round-trip" bar), but the underlying MECHANISM this job proves is a
  # third, genuinely different one — see `macos/cratestack_cbor.podspec`'s
  # header comment and `lib/src/native/native_cbor_codec.dart`'s macOS doc
  # comment for the full explanation (CocoaPods LINKS the vendored
  # xcframework rather than merely copying it, which is what lets the Dart
  # side resolve it with a fixed relative string and no path computation at
  # all).
  #
  # This job's steps and their exact commands were VERIFIED end to end on a
  # real `macos-latest` runner before this job existed in this file — see
  # `spike/cbor-macos-xcframework` (`.github/workflows/spike-cbor-macos.yml`,
  # cratestack#563), a throwaway spike branch kept around for reference.
  # That spike answered four questions a Linux dev machine cannot (no
  # Xcode, no `lipo`/`xcodebuild`, no `*-apple-darwin` cross-compile): which
  # scaffold `flutter create --platforms=macos` produces for a plugin with
  # no prior `macos/` (CocoaPods, not Swift Package Manager), whether
  # CocoaPods embeds+codesigns a VENDORED xcframework the same way it does
  # one it compiled itself (yes), whether the fixed relative
  # `DynamicLibrary.open` string actually resolves at runtime against a
  # vendored (not self-built) framework (yes — because CocoaPods LINKS it,
  # confirmed via `otool -L`), and the actual `lipo`/`xcodebuild
  # -create-xcframework` invocation shape (now `just cbor-vendor-macos`).
  # This job itself, however, is the first time that sequence runs wired
  # into `ci.yml` rather than a throwaway workflow_dispatch-only branch —
  # everything downstream of "does the spike's shape reproduce as a real
  # justfile recipe" is this job's own first real execution.
  #
  # Also vendors the web artifact for the same reason `cratestack-cbor-
  # windows`/`cratestack-cbor-android` do (see those jobs' own comments):
  # `pubspec.yaml`'s `flutter: assets:` declaration is unconditional, and
  # Flutter has no per-platform asset conditionals, so a missing wasm pair
  # fails a macOS build too.
  #
  # VERIFIED (both items below started life as flagged guesses and have
  # since been confirmed — do not re-flag them as unknowns):
  #   - The pinned binaryen asset `binaryen-version_130-arm64-macos.tar.gz`
  #     EXISTS: `curl -I` returns 200, and this job's `Install binaryen`
  #     step succeeded on a real macos-latest run. An automated review
  #     claimed binaryen ships Intel-only macOS assets and that this name
  #     would 404, citing `version_122-x86_64-macos`; that is wrong —
  #     `version_122-arm64-macos.tar.gz` also returns 200, so arm64 macOS
  #     assets have been published for some time. `arm64` is correct here
  #     because `macos-latest` resolves to Apple Silicon.
  #   - `just cbor-vendor-web` (wasm-pack + the above binaryen) DOES work
  #     on a macOS runner: `✓ vendored 144K wasm-bindgen build` on the same
  #     green run. The spike had faked this with placeholder files, so it
  #     was genuinely open until that run.
  #
  #   - `bash` for every `just <recipe>` step's internal shell (this
  #     justfile's global `set shell := ["bash", ...]`): macOS runners ship
  #     a real `/bin/bash`, and every `just` step in this job ran, so this
  #     is settled too.
  #
  # Why the wasm item above was open at all: the macOS spike deliberately
  # faked the wasm assets with placeholder files, so that this unrelated,
  # already-understood Android-slice trap could not mask the macOS-specific
  # findings the spike existed to answer. That made a real wasm-pack build
  # on macOS genuinely untested until this job ran.
  cratestack-cbor-macos:
    needs: [cbor-glue, changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack_cbor macos — real build, xcframework + round-trip proof)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the channel; add BOTH Darwin targets to
      # that pinned toolchain (not to whatever `stable` resolves to
      # separately) — `just cbor-vendor-macos` builds arm64 then x86_64 in
      # turn via two `cbor-vendor-lib` calls, both against this same
      # toolchain.
      - uses: dtolnay/rust-toolchain@stable
      # NOTE: deliberately NOT `with: targets: …` on the action above. That
      # input installs targets for the toolchain the ACTION resolves
      # (`stable`), but this repo's `rust-toolchain.toml` pins the channel to
      # 1.98.0 — so every `cargo build` here runs under 1.98.0, which would
      # still have no Darwin cross-target and fails with
      # `error[E0463]: can't find crate for 'core'` on the x86_64 leg.
      # Observed for real on PR #685's first run. `rustup target add` as a
      # RUN step executes inside the checkout, where the toolchain file
      # applies, so it adds to 1.98.0 — which is the toolchain that matters.
      - name: Add both Darwin targets (to the pinned toolchain, not stable)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      # The Flutter SDK — same reason as every other cbor job (see
      # cratestack-cbor-package's comment): cratestack_cbor's
      # `flutter.plugin.platforms` pubspec key requires the real Flutter
      # SDK to resolve at all, not a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # frb codegen DOES work on macOS (unlike Windows), but this job takes
      # the shared artifact anyway: it drops a multi-minute
      # `cargo install --locked flutter_rust_bridge_codegen` from the leg,
      # and it means macOS and Windows consume byte-identical glue rather
      # than two independently-generated copies that merely ought to match.
      - name: Restore frb glue (generated once on Linux by `cbor-glue`)
        uses: actions/download-artifact@v8
        with:
          name: cbor-frb-glue
          path: .
      - name: Assert the glue is present
        run: |
          set -euo pipefail
          test -f crates/cratestack-client-flutter/src/frb_generated.rs \
            || { echo "::error::frb_generated.rs missing after download-artifact — the cbor-frb-glue artifact did not restore. cargo build --features frb-glue would fail with E0583." >&2; exit 1; }
          test -d dart-packages/cratestack_cbor/lib/src/native/rust \
            || { echo "::error::Dart glue directory missing after download-artifact." >&2; exit 1; }
          echo "✓ frb glue restored"
      # Same reason as every other cbor job's identical step — see the job
      # header comment above for what is and is not verified about this
      # specific asset name on macOS.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-arm64-macos.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      # NOT `just cbor-vendor-native` — see the job header comment for why
      # (it hardcodes a Linux-target build that cannot link here). The glue
      # half was restored from the `cbor-glue` artifact above.
      - name: Vendor macOS native artifact (both Darwin arches, lipo, xcframework)
        run: just cbor-vendor-macos
      - name: Vendor web artifact (required by the pubspec asset list — see job header comment)
        run: just cbor-vendor-web
      - name: flutter build macos + assert vendored xcframework present (universal) + round-trip
        run: just cbor-example-verify-macos

  # ---- cratestack_cbor iOS platform (cratestack#563 iOS slice) ----
  # Mirrors `cratestack-cbor-macos` in every structural respect (same "real
  # build + assert the artifact is actually bundled + round-trip" bar, same
  # job shape), reusing the SAME underlying mechanism macOS already proved
  # (CocoaPods LINKS a vendored xcframework rather than merely copying it —
  # see `ios/cratestack_cbor.podspec`'s and `native_cbor_codec.dart`'s own
  # comments) rather than a fourth one. What genuinely differs from the
  # macOS job: three iOS rustup targets instead of two Darwin ones, `just
  # cbor-vendor-ios` instead of `cbor-vendor-macos` (builds all three iOS
  # triples, assembles a flat/shallow TWO-slice xcframework — device +
  # universal simulator — and asserts it has zero symlinks; see that
  # recipe's own header comment for the "why zero, and what to do if that
  # assertion ever fires" reasoning), and `just cbor-example-verify-ios`
  # builds `--simulator --no-codesign` and drives a booted `xcrun simctl`
  # simulator rather than running a built binary directly (no code-signing
  # identity exists on a hosted runner, so only the simulator slice is
  # actually exercised in CI — see that recipe's own comment for why that
  # asymmetry is accepted, the same way Android's CI-vs-local split is).
  #
  # NO SPIKE BRANCH preceded this job the way `spike/cbor-macos-xcframework`
  # preceded `cratestack-cbor-macos` — it is written directly against
  # Flutter's own `plugin_ffi` iOS template, the already-proven macOS
  # mechanism, and Apple's documented `simctl` command surface. This job is
  # therefore this repo's toolchain's first-ever real execution of anything
  # iOS-targeted, in the same sense the macOS job originally was for
  # anything macOS-targeted — treat the first few runs as verifying
  # assumptions, not just as a regression gate.
  #
  # Also vendors the web artifact for the same reason `cratestack-cbor-
  # windows`/`-macos`/`-android` do (see those jobs' own comments):
  # `pubspec.yaml`'s `flutter: assets:` declaration is unconditional, and
  # Flutter has no per-platform asset conditionals, so a missing wasm pair
  # fails an iOS build too.
  #
  # THE SIMULATOR RUN IS A BLOCKING GATE — a maintainer decision, recorded
  # here because it is the obvious thing to weaken the first time it flakes.
  # It boots a simulator, installs, launches, and reads the marker back out
  # of the device log, which is more moving parts than any other platform's
  # verification (the desktop jobs just grep a process's stdout). It was
  # nonetheless kept blocking because every platform on cratestack#563 has
  # met the same bar — the artifact is INSIDE the built bundle AND a real
  # running app round-trips the shared fixture — and iOS shipping on a
  # weaker bar than Linux, Android, Windows and macOS would make the
  # platform claim mean something different from the others.
  #
  # Contrast `cbor-example-verify-android-emulator`, which is deliberately
  # local-only: that recipe was excluded from CI on cost/flake grounds, and
  # the Android job asserts APK contents instead. If the simulator turns out
  # to be flaky in the same way, THAT is the shape to fall back to — assert
  # bundle contents in CI, move the run to a local recipe — and it should be
  # a deliberate change with the same reasoning written down, not a quiet
  # `continue-on-error:` added to this step.
  cratestack-cbor-ios:
    needs: [cbor-glue, changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cbor == 'true' }}
    timeout-minutes: 45
    name: flutter (cratestack_cbor ios — real build, xcframework + round-trip proof)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Present for the same reason every other Rust-using cbor job has it:
      # it is what installs/normalises the toolchain rather than relying on
      # whatever rustup the runner image happens to ship. Omitting it left
      # this job the only Rust job in the workflow without a toolchain step
      # — it might well have worked (macos-latest preinstalls Rust, and
      # rust-toolchain.toml would pull 1.98.0 on first use), but "probably
      # fine and unlike every sibling job" is not a property worth having in
      # a job whose first real run is also its first test.
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the channel; add all three iOS targets to
      # that pinned toolchain (not to whatever `stable` resolves to
      # separately) — same reasoning as `cratestack-cbor-macos`'s identical
      # step (see that job's own comment for the E0463 failure this avoids).
      # NOTE this must stay a RUN step, not the action's `targets:` input:
      # that input installs against `stable`, not the pinned 1.98.0, which
      # is exactly what caused a real E0463 on the macOS leg.
      - name: Add all three iOS targets (to the pinned toolchain, not stable)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      # The Flutter SDK — same reason as every other cbor job (see
      # cratestack-cbor-package's comment): cratestack_cbor's
      # `flutter.plugin.platforms` pubspec key requires the real Flutter
      # SDK to resolve at all, not a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # frb codegen DOES work on macOS (unlike Windows), but this job takes
      # the shared artifact anyway — same reasoning as `cratestack-cbor-
      # macos`'s identical step: drops a multi-minute `cargo install` and
      # guarantees every platform leg consumes byte-identical glue.
      - name: Restore frb glue (generated once on Linux by `cbor-glue`)
        uses: actions/download-artifact@v8
        with:
          name: cbor-frb-glue
          path: .
      - name: Assert the glue is present
        run: |
          set -euo pipefail
          test -f crates/cratestack-client-flutter/src/frb_generated.rs \
            || { echo "::error::frb_generated.rs missing after download-artifact — the cbor-frb-glue artifact did not restore. cargo build --features frb-glue would fail with E0583." >&2; exit 1; }
          test -d dart-packages/cratestack_cbor/lib/src/native/rust \
            || { echo "::error::Dart glue directory missing after download-artifact." >&2; exit 1; }
          echo "✓ frb glue restored"
      # Same reason as every other cbor job's identical step — see
      # `cratestack-cbor-macos`'s job header comment for what is and is not
      # verified about this specific asset name on macOS.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-arm64-macos.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      # NOT `just cbor-vendor-native` — see `cratestack-cbor-macos`'s job
      # header comment for why (it hardcodes a Linux-target build that
      # cannot link here). The glue half was restored from the `cbor-glue`
      # artifact above.
      - name: Vendor iOS native artifact (all three triples, lipo, flat xcframework)
        run: just cbor-vendor-ios
      - name: Vendor web artifact (required by the pubspec asset list — see job header comment)
        run: just cbor-vendor-web
      - name: flutter build ios --simulator + assert vendored xcframework present (universal simulator slice) + round-trip on a booted simulator
        run: just cbor-example-verify-ios

  # ---- TypeScript client verification (issue #419) --------------------------
  # Blocking. Proves the default TypeScript client layout typechecks for
  # both REST and RPC transports. While the `react-vite-swr-example` job
  # already exercises `--swr` over REST, it was the *only* TypeScript job
  # doing real typechecking — RPC fixtures existed as Rust-side generator
  # test snapshots but were never run through `tsc` (unlike Dart, which has
  # both `ci_rest` and `ci_rpc` fixtures exercised through `flutter analyze`).
  #
  # `just verify-typescript` generates both fixtures from committed `.cstack`
  # files, then runs `npm install` and `npm run build` (which invokes `tsc`)
  # on each, the same discipline `dart-verify` uses. The REST fixture proves
  # the default template set produces valid TypeScript; the RPC fixture
  # proves the RPC-specific template overrides do as well.
  typescript-verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ts == 'true' }}
    timeout-minutes: 45
    name: typescript (generated packages — REST + RPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate + tsc typecheck (default layout, REST + RPC)
        run: just verify-typescript
      # cratestack#779 guard #2. The step above installs the declared
      # caret ranges, which npm resolves to the NEWEST matching version —
      # so it proves the ceiling and says nothing about the floor. This
      # one pins @cratestack/refine and @cratestack/cbor to the EXACT
      # versions `package_floors.rs` names and typechecks against those.
      # It is the only check anywhere that can catch a floor naming a
      # version npm never published, or one too low to compile against —
      # the class of defect #754 found on the Dart side.
      #
      # `if: !cancelled()` so a failure above does not mask this, matching
      # the pattern the example jobs use.
      - name: Resolve + typecheck at the declared npm API floors
        if: ${{ !cancelled() }}
        run: just verify-typescript-floors

  # ---- Flutter + Riverpod example app (issue #303, epic #297's last story) ----
  # Blocking. Proves the `riverpod` preset end to end in a real Flutter app,
  # the same "example app, not just fixtures" bar `react-vite-swr-example`
  # sets for the TypeScript `--swr` flag. Reuses `react-vite-swr`'s own
  # schema/server (`examples/react-vite-swr/schema.cstack`) rather than
  # standing up a second Postgres-backed server crate — see this example's
  # README for why.
  #
  # `examples/flutter-riverpod/app` deliberately never gets `flutter build`/
  # `flutter run` here: it has no committed platform scaffolding (`android/`,
  # `ios/`, `macos/` are gitignored and regenerated locally via
  # `flutter create .`, the same precedent `embedded-flutter` set), and
  # building one would need a real device/simulator target this runner
  # doesn't have. What *is* covered: the committed `client/` matches the
  # real generator (`--check`, same drift-check discipline
  # `react-vite-swr-example` uses), `dart run build_runner build` actually
  # expands the checked-in `@riverpod` annotations (via `generate-dart
  # --run-build-runner` itself — this job doubles as CI coverage for that
  # flag), `flutter analyze` is clean on both `client/` and `app/`, and
  # `flutter test` passes for both — including `app/test/boards_screen_test.dart`,
  # a real `flutter_test` widget test that pumps the actual `BoardsScreen`
  # against a fake adapter and asserts on rendered text, not just a
  # `ProviderContainer.read`. What's NOT covered here: an actual
  # `flutter run` against a live server — see the PR description's manual
  # verification section for that (run locally with the pinned SDK).
  flutter-riverpod-example:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dart == 'true' }}
    timeout-minutes: 45
    name: flutter (flutter-riverpod example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Assert the committed example clients match the real generator
        run: just regen-examples --check
      # --- issue #471: drift above must not mask the coverage below -----
      # The drift-check step has no `continue-on-error`, so a failure
      # there still fails the job overall (`!cancelled()` only overrides
      # the *default* `success()` guard on downstream steps — it does not
      # swallow the failure). Every step below therefore gets
      # `if: ${{ !cancelled() }}` so a red drift check no longer skips six
      # steps of real Flutter coverage (the #444 regression: two days
      # where this job was red *and* ran zero analyze/test). `!cancelled()`
      # rather than `always()` so a cancelled run still skips cleanly
      # instead of racing a teardown. None of these steps depend on the
      # drift step's outcome: this one regenerates the client for real
      # (no `--check`), so `flutter analyze`/`flutter test` below always
      # run against freshly generated, buildable code even when the
      # committed copy has drifted.
      - name: Regenerate + run build_runner via --run-build-runner (issue #303)
        if: ${{ !cancelled() }}
        run: |
          cd examples/flutter-riverpod/client && flutter pub get
          cd "$GITHUB_WORKSPACE"
          # `--no-native-cbor` must match `just regen-examples` and the
          # committed `client/` (cratestack#708). Native is the DEFAULT codec
          # since the cratestack#563 follow-up, so without this flag the
          # regeneration below overwrites the committed pubspec with
          # `cratestack_cbor: ^<workspace version>` — which pub.dev does not
          # have until *after* that version is published, so `flutter pub get`
          # fails on every release-bump PR while passing on `main`. The native
          # path has its own end-to-end coverage in the `native_cbor_*` block;
          # this fixture is deliberately codec-orthogonal. See the justfile's
          # `--no-native-cbor` comment for the full rationale.
          cargo run -p cratestack-cli -- generate-dart \
            --schema examples/react-vite-swr/schema.cstack \
            --out examples/flutter-riverpod/client \
            --library-name flutter_riverpod_client \
            --preset riverpod \
            --no-native-cbor \
            --run-build-runner
      - name: flutter analyze (client)
        if: ${{ !cancelled() }}
        working-directory: examples/flutter-riverpod/client
        run: flutter analyze --fatal-warnings --no-fatal-infos
      - name: flutter test (client)
        if: ${{ !cancelled() }}
        working-directory: examples/flutter-riverpod/client
        run: flutter test
      - name: flutter pub get (app)
        if: ${{ !cancelled() }}
        working-directory: examples/flutter-riverpod/app
        run: flutter pub get
      - name: flutter analyze (app)
        if: ${{ !cancelled() }}
        working-directory: examples/flutter-riverpod/app
        run: flutter analyze --fatal-warnings --no-fatal-infos
      - name: flutter test (app)
        if: ${{ !cancelled() }}
        working-directory: examples/flutter-riverpod/app
        run: flutter test
      # --- cratestack#754: prove the emitted API floors, don't assert them ---
      # Everything above resolves `cratestack_annotations`/`cratestack_builder`
      # to whatever pub picks as newest inside the emitted caret range, so a
      # floor that is too low is INVISIBLE here — which is exactly how the
      # previous `^0.8.8` floor survived naming a version that was never
      # published, on a justification that was false (see
      # `docs/tooling/dart-publishing.md`). This step pins both packages to the
      # floor EXACTLY via `pubspec_overrides.yaml` and re-analyzes, so the day
      # the generator emits an annotation argument the floor release does not
      # have, this fails here rather than at a user's build.
      #
      # `flutter analyze` is the check that bites, NOT `build_runner` —
      # measured, not assumed. Pinned to 0.8.7 (which lacks
      # `nonDefaultingListFields`, an argument this very client emits),
      # `build_runner` still reports "wrote 13 outputs" and exits 0: an older
      # builder simply does not read the argument, and source_gen does not fail
      # on analysis errors in its inputs. `flutter analyze` reports
      # `undefined_named_parameter` on the emitted `@CratestackBuilder(...)`
      # call sites and exits non-zero. build_runner still runs first, because
      # analyze needs the generated `part` files to exist.
      #
      # The versions are read out of `package_floors.rs` rather than restated,
      # so this step cannot drift from the constants it is checking. Last step
      # in the job on purpose: it rewrites generated output, and running it
      # earlier would mean `flutter analyze`/`flutter test` above graded
      # floor-resolved output instead of current.
      - name: Resolve + analyze at the declared API floor
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          floor() {
            # The constants are now BARE lower bounds (`"0.8.10"`) — the
            # ceiling is derived by `release_line::requirement`, so it is
            # not in the file to read and pinning it would be meaningless
            # anyway (it names a version that deliberately does not exist
            # yet). An optional `^`/`>=` prefix is still accepted so this
            # keeps working against an older checkout.
            #
            # The guard below is what makes the optional prefix safe: if
            # the constants change shape again, this returns empty and the
            # step fails loudly instead of silently pinning nothing.
            grep -oP "${1}: &str = \"(\\^|>=)?\\K[0-9]+(\\.[0-9]+)*" \
              crates/cratestack-client-dart/src/package_floors.rs
          }
          annotations="$(floor CRATESTACK_ANNOTATIONS_FLOOR)"
          builder="$(floor CRATESTACK_BUILDER_FLOOR)"
          # cratestack#779: this client depends on cratestack_cbor now
          # that `just regen-examples` no longer passes --no-native-cbor,
          # so its floor gets pinned and analyzed here on the same terms
          # as the other two.
          cbor="$(floor CRATESTACK_CBOR_FLOOR)"
          if [ -z "$annotations" ] || [ -z "$builder" ] || [ -z "$cbor" ]; then
            echo "::error::could not read the API floors out of package_floors.rs — did the constants get renamed or reformatted? This step is meaningless until it can read them." >&2
            exit 1
          fi
          echo "pinning cratestack_annotations=$annotations cratestack_builder=$builder cratestack_cbor=$cbor"
          cd examples/flutter-riverpod/client
          cat > pubspec_overrides.yaml <<EOF
          # Generated by CI (cratestack#754/#779). Not committed — see the workflow step.
          dependency_overrides:
            cratestack_annotations: $annotations
            cratestack_builder: $builder
            cratestack_cbor: $cbor
          EOF
          trap 'rm -f pubspec_overrides.yaml' EXIT
          flutter pub get
          dart run build_runner build
          flutter analyze --fatal-warnings --no-fatal-infos

  # ---- JS packages (packages/*) -----------------------------------------
  # Blocking. Covers the hand-written npm packages — @cratestack/api's
  # split family (ts-types, link-batch, link-logger, runtime-fetch,
  # runtime-axios, validator-zod, validator-yup, adapter-tanstack-query,
  # adapter-rtk, and the api compat shim itself), plus
  # cratestack-vscode-plugin (the VS Code extension, which does define
  # build/test/lint and participates here). @cratestack/cli declares only
  # a postinstall script, so turbo simply skips it. `examples/*` is NOT part of this pnpm workspace — those
  # are self-contained consumer projects with their own toolchains
  # (napi/wasm/tauri), scoped out via `pnpm-workspace.yaml`'s
  # `packages/*` glob.
  #
  # `cratestack-cbor-node` (issue #286) and `cratestack-cbor-web` (issue
  # #287) ARE part of this pnpm workspace (packages/*) but are excluded
  # from this job's turbo run via `--filter` — unlike every other package
  # here, their "build" scripts need a real Rust toolchain (`napi build`
  # / `wasm-pack build` respectively), which this job deliberately
  # doesn't set up (that's the whole point of keeping `js`
  # napi/wasm/tauri-free, per the comment above). See the dedicated
  # `js-cbor-napi` / `js-cbor-wasm` jobs instead.
  #
  # `cratestack-refine` (issue #571) is excluded the same way, for a
  # different reason: its own build/lint need nothing beyond Node, but its
  # *tests* drive a real generated TypeScript client fixture that only the
  # `cratestack generate-typescript` Rust binary can produce, and that
  # fixture is deliberately not committed (issue #577). See the dedicated
  # `js-refine` job instead.
  js:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ts == 'true' }}
    timeout-minutes: 45
    name: js (pnpm + turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        # pnpm install runs postinstall for every workspace package,
        # including cratestack-cli-npm's — which downloads the GitHub
        # Release binary matching whatever version is currently in its
        # package.json. Between a version-bump PR merging and the
        # matching tag/release actually existing (or on the bump PR's
        # own branch before it merges at all), that release doesn't
        # exist yet — a plain install would 404. Neither turbo's build/
        # test/lint tasks nor anything else in this job touches the
        # downloaded binary (cli-npm has no build/test script of its
        # own), so skipping the download costs no real coverage.
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        # Local (actions/cache) turbo cache, not Vercel's hosted Remote
        # Cache — that would need a new external account and
        # TURBO_TOKEN/TURBO_TEAM secrets neither of which exist yet.
        # This is free and needs no new setup; upgrading to the hosted
        # cache later is a drop-in env-var change, not a rewrite.
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build, test, lint (turbo)
        # cratestack-refine excluded alongside cbor-node/cbor-web: its test
        # suite needs a real generated TypeScript client fixture that only
        # `cratestack generate-typescript` (a Rust binary) can produce —
        # see the js-refine job below, which is to this package what
        # js-cbor-napi/js-cbor-wasm are to those two.
        run: pnpm turbo run build test lint --filter='!./packages/cratestack-cbor-node' --filter='!./packages/cratestack-cbor-web' --filter='!./packages/cratestack-refine'

  # ---- @cratestack/cbor-node (native N-API addon) -----------------------
  # Blocking, but split out of `js` above: this is one of two packages/*
  # packages whose "build" script needs a real Rust toolchain (`napi build`
  # compiles crates/cratestack-cbor-napi), so it gets its own toolchain
  # setup instead of adding that requirement to every other JS package's
  # job. Single-platform (this runner's host target) sanity build+test —
  # NOT the full per-platform release matrix `release-cli.yml` uses for
  # `cratestack-cli`. That matrix (multiple OS/arch legs, `napi artifacts`,
  # `napi prepublish -t npm`, optionalDependencies subpackage publishing)
  # is deliberately deferred — see the PR that introduced this job (issue
  # #286) for the explicit scope note. This job only proves the crate +
  # package genuinely build and pass tests on CI, not that every published
  # target does.
  js-cbor-napi:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ts == 'true' }}
    timeout-minutes: 45
    name: js (@cratestack/cbor-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build, test, lint @cratestack/cbor-node
        run: pnpm turbo run build test lint --filter='./packages/cratestack-cbor-node'
      # @cratestack/cbor (issue #288, the umbrella package) deliberately has
      # no `^build` dependency on @cratestack/cbor-node in turbo.json (see
      # that file's comment) — the plain `js` job above excludes cbor-node,
      # so the umbrella's own build/test can't require it there. Its Node
      # round-trip suite (tests/node.test.ts) self-skips when
      # @cratestack/cbor-node isn't actually built on disk, which would make
      # every `js` job run skip it silently forever if this were its only
      # exercise. Running it here — as its own step, AFTER cbor-node's own
      # build step above already produced real dist/native.mjs output — is
      # what gives it real, non-skipped Node-side coverage. (Separate step,
      # not a combined `--filter`, on purpose: two packages passed to one
      # turbo invocation with no dependency edge between them have no
      # guaranteed build order, which would make this a race instead of a
      # guarantee.)
      - name: Build, test, lint @cratestack/cbor (Node-side real coverage)
        run: pnpm turbo run build test lint --filter='./packages/cratestack-cbor'

  # ---- @cratestack/cbor-web (wasm-bindgen addon) -------------------------
  # Same rationale as js-cbor-napi above, for the other Rust-toolchain-
  # needing packages/* package: its "build" script's `prebuild` hook runs
  # `wasm-pack build`, needing a Rust wasm32 toolchain the plain `js` job
  # deliberately doesn't set up.
  js-cbor-wasm:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ts == 'true' }}
    timeout-minutes: 45
    name: js (@cratestack/cbor-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # wasm32-unknown-unknown is installed by rustup from
      # rust-toolchain.toml's `targets` for the pinned channel (same
      # mechanism the `tests-studio` job's Trunk build relies on).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # Same reason as the publish-npm-cbor-web job in release-cli.yml,
      # which carries the full explanation: wasm-pack downloads its own
      # binaryen (hardcoded version_117) mid-build unless a `wasm-opt`
      # is already on PATH, and that unpinned fetch failed a real
      # release run. This job runs the same `wasm-pack build` on every
      # push, so it is exposed to the identical flake.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build, test, lint @cratestack/cbor-web
        run: pnpm turbo run build test lint --filter='./packages/cratestack-cbor-web'

  # ---- @cratestack/refine (dataProvider over a generated TS client) -----
  # Same rationale as js-cbor-napi/js-cbor-wasm above, for the third
  # packages/* package that needs a Rust toolchain the plain `js` job
  # deliberately doesn't set up — but for a different reason than those
  # two: this package's own build/lint need nothing beyond Node, only its
  # *tests* do, because they drive TWO REAL generated TypeScript clients
  # (cratestack#571, plus its RPC-transport follow-up) rather than a
  # hand-written stand-in for either. Neither fixture is committed
  # (cratestack#577 — "don't commit generated build output"), so both have
  # to be produced here, fresh, by the real `cratestack generate-typescript`
  # CLI before `pnpm turbo test` runs — `just refine-fixture`/
  # `just refine-rpc-fixture` are the two recipes this job and a local dev
  # both use, so they can't drift apart into hand-copied invocations (same
  # discipline as `regen-examples` for the two example clients below). If
  # either step is ever skipped or misconfigured, the test suite itself
  # fails loudly (not a silent skip) — see
  # packages/cratestack-refine/tests/support/assert-fixture-present.ts,
  # a vitest `globalSetup` that throws with instructions when either
  # fixture directory is missing.
  js-refine:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ts == 'true' }}
    timeout-minutes: 45
    name: js (@cratestack/refine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Generate the real REST TypeScript client fixture (cratestack#571/#577)
        run: just refine-fixture
      - name: Generate the real RPC TypeScript client fixture (cratestack#571/#577)
        run: just refine-rpc-fixture
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build, test, lint @cratestack/refine
        run: pnpm turbo run build test lint --filter='./packages/cratestack-refine'

  # ---- react-vite-swr example (generated client with --swr) -------------
  # Blocking. Issue #306 (epic #298's last story), flag shape updated by
  # issue #591 (`--preset swr` -> additive `--swr`): the example under
  # examples/react-vite-swr is NOT part of the `packages/*` pnpm workspace
  # (see the `js` job's own comment on why examples/* is scoped out) — it's
  # its own two-package pnpm workspace (`client/` + `web/`, via its own
  # pnpm-workspace.yaml, mirroring react-nextjs-daisyui's napi+web split).
  # Gets its own toolchain setup (Rust, for the drift check against the
  # real generator + the example server's offline test) rather than
  # folding into `js` above.
  #
  # Covered here: the checked-in `client/` matches the real
  # `cratestack generate-typescript --swr` output (`--check`, so it can't
  # silently drift), the example server crate builds and its offline test
  # passes, and both the generated client and the web app typecheck, with
  # the web app additionally linted.
  #
  # NOT covered here (deliberately, cost-consciously — this repo's own
  # `dart-verify` job takes the same generate-and-typecheck-only approach
  # rather than actually running the generated app): a real Postgres-
  # backed run of the server (the example's
  # `crud_and_procedure_round_trip_over_http` test skips silently here,
  # same as every other `CRATESTACK_TEST_DATABASE_URL`-gated test outside
  # `tests-db`/`just test-pg`) and driving the React app in a real browser
  # to observe mutation invalidation — both were run manually against a
  # real Postgres instance; see the PR description for what was run and
  # observed.
  react-vite-swr-example:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ts == 'true' }}
    timeout-minutes: 45
    name: js (react-vite-swr example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Assert the committed example clients match the real generator
        run: just regen-examples --check
      # --- issue #471: drift above must not mask the coverage below -----
      # Same fix as `flutter-riverpod-example`, applied to every step in
      # this job (the drift check here sits ahead of *all* real coverage —
      # cargo test, pnpm install, the client build, and the web app
      # typecheck/lint — unlike the Flutter job, where setup steps precede
      # the drift check too). No `continue-on-error` on the drift step, so
      # the job still ends red on drift; `if: ${{ !cancelled() }}` only
      # overrides the default `success()` guard so these steps run anyway.
      # Unlike the Flutter job, nothing here regenerates the client before
      # building it, so "Build the generated client" typechecks whatever
      # is actually committed (including drift) — that's the correct
      # signal: it's real coverage of the committed code, not a re-derived
      # copy of it.
      - name: cargo test (offline — the DB-gated test skips cleanly without CRATESTACK_TEST_DATABASE_URL)
        if: ${{ !cancelled() }}
        run: cargo test -p react-vite-swr-example
      - uses: pnpm/action-setup@v6
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/react-vite-swr/pnpm-lock.yaml
      - name: pnpm install
        if: ${{ !cancelled() }}
        working-directory: examples/react-vite-swr
        run: pnpm install --frozen-lockfile
      - name: Build the generated client (typechecks client/ for real)
        if: ${{ !cancelled() }}
        working-directory: examples/react-vite-swr
        run: pnpm --filter react-vite-swr-client run build
      - name: Typecheck + lint the web app
        if: ${{ !cancelled() }}
        working-directory: examples/react-vite-swr
        run: |
          pnpm --filter react-vite-swr-web run typecheck
          pnpm --filter react-vite-swr-web run lint

  # ---- react-vite-refine example (generated client + WireMock backend) --
  # Blocking. Docs: examples/react-vite-refine/README.md. Unlike
  # react-vite-swr-example above, NOTHING generated is committed here —
  # neither the `--refine` TypeScript client nor the WireMock stub
  # mappings (maintainer instruction: don't commit generated build
  # output) — and there is no Postgres server at all: `just
  # react-vite-refine-fixture` produces both artifacts fresh every run,
  # and the "backend" this app talks to is a real container built from
  # `crates/cratestack-mock-wiremock/docker/Dockerfile` — the only
  # WireMock image that actually works for the stateful model-CRUD
  # stubs (a plain `wiremock/wiremock` + the extension's published jar
  # throws `AbstractMethodError`; see that crate's README before
  # changing anything here). GitHub-hosted `ubuntu-latest` runners ship
  # Docker already (same assumption the testcontainers-based `tests-db`/
  # `tests-redis` jobs make), so this job builds the image with a plain
  # `docker build`/`docker run` — one fixed, long-lived container for the
  # whole job — rather than testcontainers, which up to now this repo has
  # only ever used to pull a prebuilt image (Postgres/Redis), never to
  # build one from source. This is also the FIRST CI job anywhere in this
  # repo that actually builds and runs `cratestack-mock-wiremock`'s
  # Docker image (its own `tests/models.rs`/`tests/procedures.rs` assert
  # on generated Handlebars template *text* only, offline — see that
  # file's doc comment) — a real, if bounded, new cost: the image's build
  # downloads the pinned 2.6 MB `wiremock-state-extension-standalone` jar
  # from Maven Central and verifies its sha256, and there is no Docker
  # layer caching wired here yet (nothing in this repo does that today),
  # so a cold cache pays that cost on every run. (This used to be a git
  # clone + `./gradlew shadowJar` from source, which was far more
  # expensive; see the Dockerfile's header for why that is no longer
  # necessary — the shaded artifact IS published, contrary to what an
  # earlier revision of that comment claimed.)
  #
  # Covered here: `cargo test` (offline, no Docker — the schema/generator
  # coverage in tests/smoke.rs), the real docker build + run, the
  # generated client + web app build/typecheck/lint, and `pnpm run
  # verify` — a real create/list/update/delete/404 round trip against the
  # LIVE container (web/scripts/verify.ts), including the confirmed,
  # asserted gap that a stale `If-Match` is NOT rejected by this mock
  # (see the example's README "What this demo can't prove" section — that
  # gap is asserted, not just documented, so a future
  # `cratestack-mock-wiremock` change that fixes it fails this job loudly
  # instead of leaving the README quietly wrong).
  react-vite-refine-example:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ts == 'true' }}
    timeout-minutes: 45
    name: js (react-vite-refine example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: cargo test (offline schema + generator coverage)
        run: cargo test -p react-vite-refine-example
      - name: Generate the TypeScript client + WireMock stubs
        run: just react-vite-refine-fixture
      - name: Build the stateful WireMock image
        run: |
          docker build -t cratestack-wiremock-stateful \
            -f crates/cratestack-mock-wiremock/docker/Dockerfile \
            crates/cratestack-mock-wiremock/docker
      - name: Run the WireMock container and wait for it to be healthy
        run: |
          set -euo pipefail
          docker run -d --name cratestack-refine-mock -p 8080:8080 \
            -v "$PWD/examples/react-vite-refine/wiremock/mappings:/home/wiremock/mappings:ro" \
            cratestack-wiremock-stateful
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/api/categories; then
              echo "WireMock is up"
              exit 0
            fi
            sleep 1
          done
          echo "WireMock never became healthy" >&2
          docker logs cratestack-refine-mock
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/react-vite-refine/web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: examples/react-vite-refine/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck + lint the web app (also typechecks the generated client)
        working-directory: examples/react-vite-refine/web
        run: |
          pnpm run typecheck
          pnpm run lint
      - name: Build
        working-directory: examples/react-vite-refine/web
        run: pnpm run build
      - name: Live CRUD verification against the WireMock container
        working-directory: examples/react-vite-refine/web
        run: pnpm run verify
      - name: Stop the WireMock container
        if: always()
        run: docker rm -f cratestack-refine-mock || true

  # ---- install-cratestack-cli action smoke test --------------------------
  # Blocking. Proves the composite action in
  # .github/actions/install-cratestack-cli actually works, not just that its
  # YAML parses — same 5-target matrix release-cli.yml's own `build` job
  # uses, so every OS/arch the action claims to support gets a real,
  # network-backed download + checksum-verify + exec on its real runner
  # type. `version: latest` resolves whatever the newest real release is
  # (this repo always has one), so the test doesn't need updating on every
  # bump. `cratestack --help` is the actual proof the binary runs, not just
  # that it downloaded — a checksum match alone doesn't prove the archive
  # contains a working executable for that platform. Not `--version`:
  # confirmed by hand against a real downloaded binary that this CLI has
  # no top-level version flag, only `-h`/`--help` (`Cli`'s clap derive
  # doesn't expose one).
  install-cratestack-cli-smoke-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cli == 'true' }}
    timeout-minutes: 45
    name: install-cratestack-cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-cratestack-cli
        id: install
        with:
          version: latest
      - name: Confirm the resolved version was actually reported
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ steps.install.outputs.version }}" ]; then
            echo "::error::install-cratestack-cli produced no version output" >&2
            exit 1
          fi
          echo "Resolved version: ${{ steps.install.outputs.version }}"
      - name: cratestack --help actually runs
        shell: bash
        run: cratestack --help
